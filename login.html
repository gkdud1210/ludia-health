<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>LUDIA HEALTH — 로그인</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A1628">
<link rel="apple-touch-icon" href="ludia-icon-app.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LUDIA">
<script>
(function(){
  var s=JSON.parse(sessionStorage.getItem('ludia_session')||localStorage.getItem('ludia_session')||'null');
  if(s){sessionStorage.setItem('ludia_session',JSON.stringify(s));location.replace(s.role==='admin'||s.role==='super_admin'?'admin.html':'member.html');}
  // 로컬 개발 환경 자동 감지: file:// 또는 localhost → 관리자 세션 자동 주입
  var proto=location.protocol, host=location.hostname;
  if(proto==='file:'||(host==='localhost'||host==='127.0.0.1')){
    var mock={id:1,name:'로컬테스트',email:'local@test.com',role:'super_admin',loginAt:new Date().toISOString()};
    sessionStorage.setItem('ludia_session',JSON.stringify(mock));
    location.replace('admin.html');
  }
})();
</script>
<style>
:root{
  --navy-dark:#0A1628;--navy-mid:#1E3A5F;--navy-light:#2E5C8A;
  --blue-primary:#2E6DB4;--blue-light:#5B9BD5;--blue-pale:#B8D4F0;--blue-bg:#EBF4FF;
  --white:#FFFFFF;--off-white:#F0F4F8;--gray-light:#E2EAF2;
  --text-dark:#0A1628;--text-mid:#374151;--text-light:#6B7280;
  --success:#10B981;--danger:#EF4444;--border:#D1DCE8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:linear-gradient(145deg,var(--navy-dark) 0%,#0E2040 40%,#1A3A60 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
/* background iris decoration */
body::before{
  content:'';position:fixed;top:-120px;right:-120px;width:480px;height:480px;
  border-radius:50%;border:60px solid rgba(46,109,180,.06);pointer-events:none;
}
body::after{
  content:'';position:fixed;bottom:-80px;left:-80px;width:320px;height:320px;
  border-radius:50%;border:40px solid rgba(46,109,180,.05);pointer-events:none;
}

.wrap{width:100%;max-width:420px;position:relative;z-index:1;}

/* Logo */
.logo-area{text-align:center;margin-bottom:28px;}
.logo-icon{width:76px;height:76px;border-radius:20px;overflow:hidden;margin:0 auto 14px;
  background:#8B1A52;box-shadow:0 10px 32px rgba(0,0,0,.4);}
.logo-icon img{width:76px;height:76px;display:block;object-fit:contain;}
.logo-name{font-size:22px;font-weight:800;color:white;letter-spacing:3.5px;}
.logo-sub{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:2.5px;margin-top:3px;}

/* Card */
.card{background:white;border-radius:22px;padding:32px 36px 36px;
  box-shadow:0 24px 72px rgba(0,0,0,.28);}
@media(max-width:480px){.card{padding:24px 22px 28px;}}

/* Role toggle */
.role-toggle{display:flex;background:var(--off-white);border-radius:13px;padding:4px;
  margin-bottom:26px;gap:4px;}
.role-btn{flex:1;padding:11px 6px;border:none;border-radius:10px;background:none;
  font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--text-light);
  transition:all .22s;display:flex;align-items:center;justify-content:center;gap:7px;}
.role-btn .ri{font-size:17px;line-height:1;}
.role-btn.active{background:white;color:var(--navy-dark);
  box-shadow:0 2px 10px rgba(0,0,0,.1);}
.role-btn.active.member{color:var(--blue-primary);}
.role-btn.active.admin{color:#7C3AED;}

/* Mode tabs */
.mode-tabs{display:flex;border-bottom:2px solid var(--gray-light);margin-bottom:22px;}
.mode-tab{flex:1;padding:10px;border:none;background:none;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;color:var(--text-light);
  border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;}
.mode-tab.active.member{color:var(--blue-primary);border-bottom-color:var(--blue-primary);}
.mode-tab.active.admin{color:#7C3AED;border-bottom-color:#7C3AED;}

/* Form */
.form-title{font-size:18px;font-weight:800;color:var(--navy-dark);margin-bottom:18px;}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--navy-mid);
  margin-bottom:6px;letter-spacing:.2px;}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:9px;
  font-size:14px;color:var(--text-dark);background:white;outline:none;font-family:inherit;
  transition:border-color .2s,box-shadow .2s;}
.form-input:focus{border-color:var(--blue-primary);box-shadow:0 0 0 3px rgba(46,109,180,.1);}
.form-input.admin-focus:focus{border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.1);}

.info-box{font-size:11px;color:var(--text-light);background:var(--blue-bg);
  border:1px solid var(--blue-pale);border-radius:7px;padding:9px 12px;margin-top:5px;
  line-height:1.6;}
.info-box.admin{background:#F5F3FF;border-color:#DDD6FE;color:#5B21B6;}

.btn-submit{width:100%;padding:13px;border:none;border-radius:11px;
  background:linear-gradient(135deg,var(--blue-primary),var(--navy-mid));
  color:white;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;
  letter-spacing:.3px;box-shadow:0 4px 18px rgba(46,109,180,.35);transition:all .22s;
  margin-top:6px;}
.btn-submit:hover{filter:brightness(1.08);}
.btn-submit.admin{background:linear-gradient(135deg,#7C3AED,#4C1D95);}
.btn-submit.admin:hover{filter:brightness(1.08);}

.msg{font-size:12px;margin-top:12px;padding:10px 13px;border-radius:8px;display:none;line-height:1.5;}
.msg.error{background:#FEF2F2;color:#B91C1C;border:1px solid #FCA5A5;display:block;}
.msg.success{background:#F0FDF4;color:#065F46;border:1px solid #6EE7B7;display:block;}

/* Footer */
.login-footer{text-align:center;margin-top:22px;font-size:11px;
  color:rgba(255,255,255,.28);letter-spacing:.5px;}

/* PWA 홈화면 추가 배너 */
.pwa-banner{display:none;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);
  border-radius:16px;padding:14px 16px;margin-bottom:16px;
  align-items:center;gap:12px;}
.pwa-banner.show{display:flex;}
.pwa-banner-icon{width:46px;height:46px;border-radius:12px;overflow:hidden;flex-shrink:0;
  box-shadow:0 4px 12px rgba(0,0,0,.3);}
.pwa-banner-icon img{width:46px;height:46px;object-fit:cover;display:block;}
.pwa-banner-text{flex:1;color:white;min-width:0;}
.pwa-banner-text strong{display:block;font-size:13px;font-weight:700;margin-bottom:3px;}
.pwa-banner-text span{font-size:11px;opacity:.65;line-height:1.4;}
.pwa-banner-btn{background:white;color:#0A1628;border:none;border-radius:9px;
  padding:8px 15px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;
  white-space:nowrap;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.pwa-banner-close{background:none;border:none;color:rgba(255,255,255,.45);
  font-size:22px;cursor:pointer;line-height:1;padding:2px 4px;flex-shrink:0;}
</style>
</head>
<body>
<div class="wrap">
  <!-- PWA 홈화면 추가 배너 -->
  <div class="pwa-banner" id="pwaBanner">
    <div class="pwa-banner-icon"><img src="ludia-icon-app.png" alt="LUDIA"></div>
    <div class="pwa-banner-text">
      <strong>홈화면에 추가</strong>
      <span id="pwaBannerSub">앱처럼 빠르게 실행하세요</span>
    </div>
    <button class="pwa-banner-btn" id="pwaBannerBtn" onclick="pwaInstall()">추가</button>
    <button class="pwa-banner-close" onclick="pwaDismiss()">×</button>
  </div>

  <div class="logo-area">
    <div class="logo-icon"><img src="ludia-logo.png" alt="LUDIA"></div>
    <div class="logo-name">LUDIA HEALTH</div>
    <div class="logo-sub">IRIS DIAGNOSTIC SYSTEM</div>
  </div>

  <div class="card">
    <!-- Role toggle -->
    <div class="role-toggle" id="roleToggle">
      <button class="role-btn member active" id="btnMember" onclick="setRole('member')">
        <span class="ri">👤</span> 회원
      </button>
      <button class="role-btn admin" id="btnAdmin" onclick="setRole('admin')">
        <span class="ri">🔐</span> 관리자
      </button>
      <button class="role-btn admin" id="btnSuper" onclick="setRole('super_admin')" style="border-left:1px solid rgba(124,58,237,.2)">
        <div class="ri">🛡️</div>
        <span class="rl" style="color:#7C3AED">최종관리자</span>
      </button>
    </div>

    <!-- Mode tabs -->
    <div class="mode-tabs" id="modeTabs">
      <button class="mode-tab member active" id="tabLogin" onclick="setMode('login')">로그인</button>
      <button class="mode-tab" id="tabRegister" onclick="setMode('register')">회원가입</button>
    </div>

    <div id="formArea"></div>
    <div class="msg" id="msgArea"></div>
  </div>

  <div class="login-footer">© 2026 LUDIA HEALTH · All rights reserved</div>
</div>

<script>
let role = 'member';
let mode = 'login';

function setRole(r) {
  role = r;
  const isMember = r === 'member';
  const isAdmin  = r === 'admin';
  const isSuper  = r === 'super_admin';
  document.getElementById('btnMember').classList.toggle('active', isMember);
  document.getElementById('btnAdmin').classList.toggle('active',  isAdmin);
  const btnSuper = document.getElementById('btnSuper');
  if (btnSuper) btnSuper.classList.toggle('active', isSuper);
  const cls = isMember ? 'member' : 'admin';
  ['tabLogin','tabRegister'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('member','admin');
    el.classList.add(cls);
    if (el.classList.contains('active')) el.classList.add(cls);
  });
  renderForm();
}

function setMode(m) {
  mode = m;
  const tabL = document.getElementById('tabLogin');
  const tabR = document.getElementById('tabRegister');
  tabL.classList.toggle('active', m === 'login');
  tabR.classList.toggle('active', m === 'register');
  clearMsg();
  renderForm();
}

function clearMsg() {
  const el = document.getElementById('msgArea');
  el.className = 'msg'; el.textContent = '';
}
function showMsg(text, type) {
  const el = document.getElementById('msgArea');
  el.textContent = text; el.className = 'msg ' + type;
}

async function apiPost(action, data = {}) {
  try {
    const resp = await fetch('api.php', {
      method: 'POST', credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action, ...data})
    });
    return await resp.json();
  } catch(e) { return {error: '네트워크 오류'}; }
}

function storeSession(user, persist) {
  const data = JSON.stringify({...user, loginAt: new Date().toISOString()});
  sessionStorage.setItem('ludia_session', data);
  if (persist) localStorage.setItem('ludia_session', data);
  else localStorage.removeItem('ludia_session');
}

function renderForm() {
  const isAdmin = role === 'admin' || role === 'super_admin';
  const isSuper = role === 'super_admin';
  const isLogin = mode === 'login';
  const label = isAdmin ? '관리자' : '회원';
  const cls = isAdmin ? 'admin' : '';
  clearMsg();

  // 최종관리자: 탭 숨기고 비밀번호만 표시
  const modeTabs = document.getElementById('modeTabs');
  if (modeTabs) modeTabs.style.display = isSuper ? 'none' : '';

  const rememberChk = `
    <label style="display:flex;align-items:center;gap:7px;margin:10px 0 6px;cursor:pointer;width:fit-content">
      <input type="checkbox" id="rememberMe" style="width:15px;height:15px;accent-color:${isSuper?'#7C3AED':'var(--blue-primary)'};cursor:pointer">
      <span style="font-size:12px;font-weight:600;color:var(--text-mid)">로그인 유지</span>
    </label>`;

  if (isSuper) {
    document.getElementById('formArea').innerHTML = `
      <div class="form-title" style="color:#7C3AED">최종관리자 접속</div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input admin-focus" type="password" id="superPw" placeholder="비밀번호 입력"
          autocomplete="current-password" onkeydown="if(event.key==='Enter')doSuperLogin()">
      </div>
      ${rememberChk}
      <button class="btn-submit admin" style="background:linear-gradient(135deg,#7C3AED,#4C1D95)" onclick="doSuperLogin()">접속하기</button>
    `;
    return;
  }

  if (isLogin) {
    document.getElementById('formArea').innerHTML = `
      <div class="form-title">${label} 로그인</div>
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input class="form-input ${cls}-focus" type="email" id="loginEmail" placeholder="이메일 주소" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input ${cls}-focus" type="password" id="loginPw" placeholder="비밀번호"
          autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      ${rememberChk}
      <button class="btn-submit ${cls}" onclick="doLogin()">로그인</button>
    `;
  } else {
    document.getElementById('formArea').innerHTML = `
      <div class="form-title">${label} 회원가입</div>
      <div class="form-group">
        <label class="form-label">이름</label>
        <input class="form-input ${cls}-focus" type="text" id="regName" placeholder="성함">
      </div>
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input class="form-input ${cls}-focus" type="email" id="regEmail" placeholder="이메일 주소">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input ${cls}-focus" type="password" id="regPw" placeholder="비밀번호 (6자 이상)">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호 확인</label>
        <input class="form-input ${cls}-focus" type="password" id="regPw2" placeholder="비밀번호 재입력"
          onkeydown="if(event.key==='Enter')doRegister()">
      </div>
      ${isAdmin ? `
      <div class="form-group">
        <label class="form-label">핸드폰 번호</label>
        <input class="form-input admin-focus" type="tel" id="adminPhone" placeholder="예: 01012349141"
          oninput="updateAdminCodePreview(this.value)"
          onkeydown="if(event.key==='Enter')doRegister()">
        <div class="info-box admin" id="adminCodePreview">
          핸드폰 번호를 입력하면 관리자 코드가 자동으로 생성됩니다.
        </div>
      </div>` : `
      <div class="form-group">
        <label class="form-label">회원 초대 코드</label>
        <input class="form-input" type="text" id="inviteCode" placeholder="관리자에게 받은 초대 코드"
          style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
      </div>
      <div class="form-group">
        <label class="form-label">어르신 고유번호</label>
        <input class="form-input" type="text" id="patientUniqueId" placeholder="예: LUD-001"
          style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
        <div class="info-box">담당 관리자에게 받은 어르신 고유번호를 입력하세요. 이 번호로 건강 기록이 연결됩니다.</div>
      </div>`}
      <button class="btn-submit ${cls}" onclick="doRegister()">가입하기</button>
    `;
  }
}

function phoneToCode(digits) {
  // 010-2841-9141 → 28419141 (앞 3자리 010 제거)
  return digits.length >= 4 ? digits.slice(3) : digits;
}

function updateAdminCodePreview(val) {
  const el = document.getElementById('adminCodePreview');
  if (!el) return;
  const digits = val.replace(/\D/g,'');
  if (digits.length < 7) {
    el.innerHTML = '핸드폰 번호를 입력하면 관리자 코드가 자동으로 생성됩니다.';
    return;
  }
  const code = phoneToCode(digits);
  el.innerHTML = '관리자 코드 (자동 생성): <strong style="color:#7C3AED;font-size:14px">' + code + '</strong>';
}

async function doSuperLogin() {
  const pw = document.getElementById('superPw').value || '';
  if (!pw) { showMsg('비밀번호를 입력해주세요.', 'error'); return; }
  const persist = document.getElementById('rememberMe')?.checked || false;
  showMsg('확인 중…', 'success');
  const result = await apiPost('super_login', { password: pw, remember: persist });
  if (!result.success) { showMsg(result.error || '비밀번호가 올바르지 않습니다.', 'error'); return; }
  storeSession(result.user, persist);
  showMsg('인증 완료! 이동 중…', 'success');
  setTimeout(() => location.replace('admin.html'), 400);
}

async function doLogin() {
  const email = (document.getElementById('loginEmail').value || '').trim().toLowerCase();
  const pw    = document.getElementById('loginPw').value || '';
  if (!email || !pw) { showMsg('이메일과 비밀번호를 입력해주세요.', 'error'); return; }
  const persist = document.getElementById('rememberMe')?.checked || false;
  showMsg('확인 중…', 'success');
  const result = await apiPost('login', { email, password: pw, remember: persist });
  if (!result.success) { showMsg(result.error || '로그인 실패', 'error'); return; }
  storeSession(result.user, persist);
  showMsg('로그인 성공! 이동 중…', 'success');
  const dest = (result.user.role === 'admin' || result.user.role === 'super_admin') ? 'admin.html' : 'member.html';
  setTimeout(() => location.replace(dest), 400);
}

async function doRegister() {
  const name  = (document.getElementById('regName').value  || '').trim();
  const email = (document.getElementById('regEmail').value || '').trim().toLowerCase();
  const pw    = document.getElementById('regPw').value  || '';
  const pw2   = document.getElementById('regPw2').value || '';
  const isAdmin = role === 'admin';

  if (!name || !email || !pw || !pw2) { showMsg('모든 항목을 입력해주세요.', 'error'); return; }
  if (!/^[^@]+@[^@]+\.[^@]+$/.test(email)) { showMsg('올바른 이메일 형식을 입력해주세요.', 'error'); return; }
  if (pw.length < 6) { showMsg('비밀번호는 6자 이상이어야 합니다.', 'error'); return; }
  if (pw !== pw2)    { showMsg('비밀번호가 일치하지 않습니다.', 'error'); return; }

  const payload = { name, email, password: pw, role };
  if (isAdmin) {
    const phoneRaw = (document.getElementById('adminPhone').value || '').replace(/\D/g,'');
    if (phoneRaw.length < 7) { showMsg('핸드폰 번호를 올바르게 입력해주세요.', 'error'); return; }
    payload.phone = phoneRaw;
  } else {
    const inviteCode    = (document.getElementById('inviteCode').value       || '').trim().toUpperCase();
    const patientUid    = (document.getElementById('patientUniqueId').value   || '').trim().toUpperCase();
    if (!inviteCode)  { showMsg('회원 초대 코드를 입력해주세요.', 'error'); return; }
    if (!patientUid)  { showMsg('어르신 고유번호를 입력해주세요.', 'error'); return; }
    payload.inviteCode      = inviteCode;
    payload.patientUniqueId = patientUid;
  }

  showMsg('처리 중…', 'success');
  const result = await apiPost('self_register', payload);
  if (!result.success) { showMsg(result.error || '가입 실패', 'error'); return; }
  storeSession(result.user, false);
  showMsg('가입 완료! 이동 중…', 'success');
  setTimeout(() => location.replace(result.user.role === 'admin' ? 'admin.html' : 'member.html'), 400);
}

renderForm();

// ── PWA ──────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

let _deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _deferredPrompt = e;
  if (!localStorage.getItem('pwa_dismissed')) {
    document.getElementById('pwaBanner').classList.add('show');
  }
});

(function initIOSBanner() {
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone ||
    window.matchMedia('(display-mode: standalone)').matches;
  if (isIOS && !isStandalone && !localStorage.getItem('pwa_dismissed')) {
    const banner = document.getElementById('pwaBanner');
    document.getElementById('pwaBannerSub').textContent = '공유 버튼 → "홈 화면에 추가" 탭';
    document.getElementById('pwaBannerBtn').style.display = 'none';
    banner.classList.add('show');
  }
})();

function pwaInstall() {
  if (!_deferredPrompt) return;
  _deferredPrompt.prompt();
  _deferredPrompt.userChoice.then(() => { _deferredPrompt = null; pwaDismiss(); });
}
function pwaDismiss() {
  document.getElementById('pwaBanner').classList.remove('show');
  localStorage.setItem('pwa_dismissed', '1');
}
</script>
</body>
