function startFullEdit() {
  // Go back to step 1 with all data already loaded — user can navigate through all steps
  rptEditMode = false;
  step = 1;
  renderStep();
}

function buildVisitData() {
  const overall = fd.scores ? Math.round(Object.values(fd.scores).reduce((a,b)=>a+b,0)/8) : 0;
  return {
    overallScore: overall, scores: fd.scores,
    reportId: fd.reportId || generateReportId(),
    date: new Date().toISOString().slice(0,10),
    registeredBy: { name: _SESS.name || '알 수 없음', userId: _SESS.userId || _ROLE, role: _ROLE, registeredAt: new Date().toISOString() },
    symptoms: fd.symptoms, symptomDuration: fd.symptomDuration,
    painLevel: fd.painLevel, painDesc: fd.painDesc,
    pastConditions: fd.pastConditions, otherConditions: fd.otherConditions,
    hadSurgery: fd.hadSurgery, surgeries: fd.surgeries,
    medications: fd.medications,
    familyConditions: fd.familyConditions, familyOther: fd.familyOther,
    smoking: fd.smoking, alcohol: fd.alcohol, exercise: fd.exercise,
    sleep: fd.sleep, diet: fd.diet, stress: fd.stress,
    irisAssessment: fd.irisAssessment,
    healthRecs: fd.healthRecs||[],
    leftEyePhoto: fd.leftEyePhoto, rightEyePhoto: fd.rightEyePhoto,
    leftEyeAnnotation: fd.leftEyeAnnotation, rightEyeAnnotation: fd.rightEyeAnnotation,
    irisDrawing: fd.irisDrawing, adminNotes: ''
  };
}

function completeRegistration() {
  if (!fd.name || !fd.dob) {
    alert('환자 이름과 생년월일을 입력해 주세요. (STEP 1)');
    step = 1; renderStep(); return;
  }
  saveRecord();
  Object.assign(fd, getInitFd());
  step = 0;
  renderStep();
  setTimeout(() => {
    const app = document.getElementById('app');
    if (app) {
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#059669;color:white;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:700;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.2)';
      banner.textContent = '환자 등록이 완료되었습니다 ✓';
      document.body.appendChild(banner);
      setTimeout(() => banner.remove(), 2800);
    }
  }, 100);
}

function saveRecord() {
  if (!fd.name || !fd.dob) {
    alert(t('이름과 생년월일을 입력한 환자만 저장할 수 있습니다.','Patient name and date of birth are required to save a record.'));
    return;
  }
  let records;
  try { records = JSON.parse(localStorage.getItem('ludia_records') || '[]'); }
  catch(e) { records = []; }

  // ── UPDATE existing visit ──────────────────────────────────────
  if (fd.editingVisitId && fd.editingPatientId) {
    const patient = records.find(p => p.id === fd.editingPatientId);
    if (patient) {
      patient.name = fd.name; patient.dob = fd.dob; patient.gender = fd.gender;
      patient.phone = fd.phone; patient.email = fd.email; patient.occupation = fd.occupation;
      const vIdx = patient.visits.findIndex(v => v.id === fd.editingVisitId);
      if (vIdx !== -1) {
        const updated = buildVisitData();
        updated.id = fd.editingVisitId; // preserve original ID
        // Preserve who originally registered this visit
        updated.registeredBy = patient.visits[vIdx].registeredBy || updated.registeredBy;
        // Track when super_admin generates a report
        if (_IS_SUPER) {
          updated.reportBy = { name: _SESS.name, reportAt: new Date().toISOString() };
        } else {
          updated.reportBy = patient.visits[vIdx].reportBy || null;
        }
        patient.visits[vIdx] = updated;
      }
      try {
        localStorage.setItem('ludia_records', JSON.stringify(records));
        alert(t(`${fd.name} 님의 기록이 수정되었습니다.`, `Record updated for ${fd.name}.`));
      } catch(e) {
        alert(t('저장 실패: 저장 공간이 부족합니다.', 'Save failed: storage quota exceeded.'));
      }
      return;
    }
  }

  // ── CREATE new visit ───────────────────────────────────────────
  let patient = records.find(p => p.name === fd.name && p.dob === fd.dob);
  if (!patient) {
    const existingCount = records.length;
    const uniqueId = 'LUD-' + String(existingCount + 1).padStart(3, '0');
    const curSession = JSON.parse(sessionStorage.getItem('ludia_session') || 'null');
    patient = {
      id: 'p_' + Date.now().toString(36),
      uniqueId,
      createdBy: curSession?.userId || null,
      createdByName: curSession?.name || '알 수 없음',
      name: fd.name, dob: fd.dob, gender: fd.gender,
      phone: fd.phone, email: fd.email, occupation: fd.occupation,
      createdAt: new Date().toISOString(),
      visits: []
    };
    fd.uniqueId = uniqueId;
    records.push(patient);
  } else {
    patient.phone = fd.phone; patient.email = fd.email; patient.occupation = fd.occupation;
    fd.uniqueId = patient.uniqueId || '';
  }

  const newVisit = buildVisitData();
  newVisit.id = 'v_' + Date.now().toString(36);
  patient.visits.push(newVisit);

  try {
    localStorage.setItem('ludia_records', JSON.stringify(records));
    alert(t(
      `${fd.name} 님의 기록이 저장되었습니다.\n고유번호: ${patient.uniqueId||'–'}\n(총 ${patient.visits.length}회 방문 기록)`,
      `Record saved for ${fd.name}.\nUnique ID: ${patient.uniqueId||'–'}\n(Total ${patient.visits.length} visit${patient.visits.length>1?'s':''})`
    ));
  } catch(e) {
    alert(t('저장 실패: 저장 공간이 부족합니다.\n사진 해상도를 줄이거나 관리자 페이지에서 오래된 기록을 삭제해 주세요.',
            'Save failed: storage quota exceeded.\nReduce image size or delete old records in the admin panel.'));
  }
}

// ═══════════════════════════════════════════
//  CAMERA CAPTURE
// ═══════════════════════════════════════════
let CAM = { stream: null, side: null, devices: [], shots: [] };

async function openCamera(side) {
  CAM.side = side;
  const modal = document.getElementById('camModal');
  modal.style.display = 'flex';
  const sideLabel = side === 'left' ? t('좌안 (Left Eye)', 'Left Eye') : t('우안 (Right Eye)', 'Right Eye');
  const titleEl = document.getElementById('camModalTitle');
  const hintEl  = document.getElementById('camHint');
  if (titleEl) titleEl.textContent = t(`${sideLabel} 촬영`, `Capture — ${sideLabel}`);
  if (hintEl)  hintEl.textContent  = t('홍채가 원 안에 들어오도록 맞춘 후 📷를 누르세요',
                                        'Align the iris within the circle, then press 📷');

  try {
    CAM.devices = (await navigator.mediaDevices.enumerateDevices())
      .filter(d => d.kind === 'videoinput');
    buildCamSelect();
    await startCamStream();
  } catch(e) {
    alert(t('카메라 접근 권한이 필요합니다. 브라우저 설정에서 카메라 허용 후 다시 시도해주세요.',
            'Camera access is required. Please allow camera access in browser settings and try again.'));
    closeCameraModal();
  }
}

function buildCamSelect() {
  const sel = document.getElementById('camDeviceSelect');
  sel.innerHTML = '';
  if (CAM.devices.length <= 1) { sel.style.display = 'none'; return; }
  sel.style.display = '';
  CAM.devices.forEach((d, i) => {
    const opt = document.createElement('option');
    opt.value = d.deviceId;
    opt.textContent = d.label || t(`카메라 ${i+1}`, `Camera ${i+1}`);
    sel.appendChild(opt);
  });
}

async function startCamStream(deviceId) {
  if (CAM.stream) { CAM.stream.getTracks().forEach(t => t.stop()); CAM.stream = null; }
  const constraints = { video: deviceId
    ? { deviceId: { exact: deviceId } }
    : { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 1280 } }
  };
  CAM.stream = await navigator.mediaDevices.getUserMedia(constraints);
  const video = document.getElementById('camVideo');
  video.srcObject = CAM.stream;
  await video.play();
}

function switchCamera() {
  const sel = document.getElementById('camDeviceSelect');
  startCamStream(sel.value).catch(()=>{});
}

function snapPhoto() {
  const video = document.getElementById('camVideo');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  // Flash effect
  const wrap = document.querySelector('.cam-video-wrap');
  if (wrap) { wrap.style.opacity = '0.3'; setTimeout(() => { wrap.style.opacity = '1'; }, 120); }
  CAM.shots.unshift(canvas.toDataURL('image/jpeg', 0.92));
  renderCamShots();
}

function renderCamShots() {
  const strip = document.getElementById('camShotsStrip');
  const label = document.getElementById('camShotsLabel');
  if (!strip) return;
  if (!CAM.shots.length) {
    strip.style.display = 'none';
    if (label) label.style.display = 'none';
    return;
  }
  strip.style.display = 'flex';
  if (label) label.style.display = '';
  strip.innerHTML = CAM.shots.map((s, i) =>
    '<div class="cam-shot-thumb">'
    + '<img src="' + s + '" onclick="selectCamShot(' + i + ')" title="이 사진 선택">'
    + '<button class="cam-shot-del" onclick="removeCamShot(' + i + ')">✕</button>'
    + '</div>'
  ).join('');
}

function selectCamShot(idx) {
  const shotSrc = CAM.shots[idx];
  const side = CAM.side;
  closeCameraModal();
  const img = new Image();
  img.onload = () => {
    const minDim = Math.min(img.naturalWidth, img.naturalHeight);
    const initFill = 220 / minDim;
    const c = CROP[side];
    c.active = true; c.src = shotSrc;
    c.imgW = img.naturalWidth * initFill;
    c.imgH = img.naturalHeight * initFill;
    c.scale = 1; c.ox = 0; c.oy = 0;
    refreshEyeSection();
  };
  img.src = shotSrc;
}

function removeCamShot(idx) {
  CAM.shots.splice(idx, 1);
  renderCamShots();
}

function closeCameraModal() {
  if (CAM.stream) { CAM.stream.getTracks().forEach(t => t.stop()); CAM.stream = null; }
  CAM.shots = [];
  const modal = document.getElementById('camModal');
  if (modal) modal.style.display = 'none';
}

// ═══════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════
init();

</script>

<!-- CAMERA MODAL -->
<div id="camModal" class="cam-modal-bg" style="display:none">
  <div class="cam-modal">
    <div class="cam-title" id="camModalTitle">홍채 촬영</div>
    <div class="cam-video-wrap">
      <video id="camVideo" autoplay playsinline muted></video>
      <div class="cam-guide-ring"></div>
    </div>
    <div class="cam-controls">
      <select id="camDeviceSelect" class="cam-select" onchange="switchCamera()" style="display:none"></select>
      <button class="cam-snap" onclick="snapPhoto()" title="촬영">📷</button>
    </div>
    <div class="cam-hint">홍채를 원 안에 맞춘 후 📷를 눌러 여러 장 촬영하세요 · 아래 사진을 탭해 선택</div>
    <div id="camShotsLabel" class="cam-shots-label" style="display:none">촬영된 사진 — 탭해서 선택</div>
    <div id="camShotsStrip" class="cam-shots-strip" style="display:none"></div>
    <button class="cam-cancel" onclick="closeCameraModal()">취소 / Cancel</button>
  </div>
</div>

</body>
