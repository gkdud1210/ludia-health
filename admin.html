<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>LUDIA HEALTH — 관리자</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A1628">
<link rel="apple-touch-icon" href="ludia-logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LUDIA">
<style>
:root{
  --navy-dark:#0A1628;--navy-mid:#1E3A5F;--navy-light:#2E5C8A;
  --blue-primary:#2E6DB4;--blue-light:#5B9BD5;--blue-pale:#B8D4F0;--blue-bg:#EBF4FF;
  --white:#FFFFFF;--off-white:#F0F4F8;--gray-light:#E2EAF2;
  --text-dark:#0A1628;--text-mid:#374151;--text-light:#6B7280;
  --success:#10B981;--warning:#F59E0B;--orange:#F97316;--danger:#EF4444;--border:#D1DCE8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--off-white);color:var(--text-dark);min-height:100vh;}
.header{background:var(--navy-dark);height:66px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.35);}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;}
.logo-eye{width:40px;height:40px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#8B1A52;}
.logo-eye img{width:40px;height:40px;display:block;object-fit:contain;object-position:center;}
.logo-name{font-size:18px;font-weight:800;color:white;letter-spacing:3px;}
.logo-tagline{font-size:10px;color:var(--blue-pale);letter-spacing:1.5px;margin-top:-1px;}
.header-badge{padding:5px 12px;border:1px solid rgba(255,255,255,.2);border-radius:20px;font-size:11px;color:rgba(255,255,255,.7);letter-spacing:.5px;}
.hdr-back{padding:5px 14px;border:1px solid rgba(255,255,255,.25);border-radius:8px;color:rgba(255,255,255,.7);font-size:12px;font-weight:600;text-decoration:none;transition:all .18s;}
.hdr-back:hover{background:rgba(255,255,255,.1);color:white;}
.mob-menu-btn{display:none;padding:6px 8px;border:none;background:none;color:white;cursor:pointer;font-size:20px;line-height:1;}
@media(max-width:768px){.mob-menu-btn{display:block;}}
/* Layout */
.admin-wrap{display:flex;min-height:calc(100vh - 66px);}
.sidebar{width:240px;flex-shrink:0;background:#0D1E38;padding:16px 0;position:sticky;top:66px;height:calc(100vh - 66px);overflow-y:auto;transition:left .3s;}
@media(max-width:768px){.sidebar{position:fixed;left:-240px;top:66px;height:calc(100vh - 66px);z-index:90;}.sidebar.mob-open{left:0;}}
.mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:89;top:66px;}
.mob-overlay.show{display:block;}
.sb-label{font-size:10px;color:rgba(255,255,255,.3);letter-spacing:1.5px;text-transform:uppercase;padding:8px 20px 4px;}
.sb-link{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:2px 8px;border-radius:9px;color:rgba(255,255,255,.6);font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;user-select:none;}
.sb-link:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9);}
.sb-link.active{background:var(--blue-primary);color:white;}
.sb-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.sb-div{height:1px;background:rgba(255,255,255,.07);margin:10px 20px;}
.main-content{flex:1;padding:28px 32px;min-width:0;}
@media(max-width:768px){.main-content{padding:16px;}}
/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
@media(max-width:900px){.stats-row{grid-template-columns:1fr 1fr;}}
@media(max-width:480px){.stats-row{grid-template-columns:1fr;}}
.stat-card{background:white;border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.stat-lbl{font-size:11px;color:var(--text-light);margin-bottom:6px;}
.stat-num{font-size:28px;font-weight:800;color:var(--navy-dark);line-height:1.1;}
.stat-sub{font-size:11px;color:var(--text-light);margin-top:4px;}
.stat-blue{border-top:3px solid var(--blue-primary);}
.stat-green{border-top:3px solid var(--success);}
.stat-orange{border-top:3px solid var(--orange);}
.stat-navy{border-top:3px solid var(--navy-mid);}
/* Table */
.tbl-card{background:white;border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.tbl-hdr{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap;}
.tbl-card-title{font-size:15px;font-weight:700;color:var(--navy-dark);}
.srch{padding:7px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;font-family:inherit;width:210px;transition:border-color .2s;}
.srch:focus{border-color:var(--blue-primary);}
@media(max-width:560px){.srch{width:130px;}}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{padding:10px 14px;font-size:10px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;text-align:left;background:var(--off-white);border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr{cursor:pointer;transition:background .12s;}
tbody tr:hover{background:#F0F7FF;}
tbody td{padding:11px 14px;font-size:13px;color:var(--text-dark);border-bottom:1px solid var(--gray-light);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
.scr-badge{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-size:12px;font-weight:800;}
.scr-g{background:#F0FDF4;color:var(--success);}
.scr-w{background:#FFFBEB;color:var(--warning);}
.scr-o{background:#FFF7ED;color:var(--orange);}
.scr-r{background:#FEF2F2;color:var(--danger);}
.trend-up{color:var(--success);font-weight:700;}
.trend-dn{color:var(--danger);font-weight:700;}
.trend-fl{color:var(--text-light);}
.act-btn{padding:5px 11px;border:1.5px solid var(--blue-primary);border-radius:7px;background:none;color:var(--blue-primary);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
.act-btn:hover{background:var(--blue-bg);}
.act-btn-danger{padding:5px 11px;border:1.5px solid #FCA5A5;border-radius:7px;background:none;color:var(--danger);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
.act-btn-danger:hover{background:#FEF2F2;}
/* Patient hero */
.pt-hero{background:linear-gradient(135deg,var(--navy-dark),var(--navy-mid));border-radius:14px;padding:22px 28px;color:white;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.pt-name{font-size:21px;font-weight:800;letter-spacing:.5px;margin-bottom:4px;}
.pt-meta{font-size:12px;opacity:.65;line-height:1.9;}
.vcb{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:12px 20px;text-align:center;flex-shrink:0;}
.vcb-num{font-size:26px;font-weight:800;}
.vcb-lbl{font-size:10px;opacity:.6;margin-top:2px;}
/* Chart */
.chart-card{background:white;border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px;}
.chart-title{font-size:13px;font-weight:700;color:var(--navy-mid);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
/* Visit cards */
.visits-list{display:flex;flex-direction:column;gap:12px;}
.vc{background:white;border:1.5px solid var(--border);border-radius:12px;padding:16px 20px;display:grid;grid-template-columns:68px 1fr auto;gap:14px;align-items:center;transition:border-color .2s;}
.vc:hover{border-color:var(--blue-light);}
.vc-date-col{text-align:center;}
.vc-day{font-size:22px;font-weight:800;color:var(--navy-dark);}
.vc-ym{font-size:10px;color:var(--text-light);}
.vc-score-row{display:flex;align-items:baseline;gap:6px;margin-bottom:5px;}
.vc-score{font-size:28px;font-weight:800;}
.vc-change{font-size:12px;font-weight:700;}
.vc-eyes{display:flex;gap:5px;margin-bottom:6px;}
.eye-th{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--border);}
.eye-th-empty{width:42px;height:42px;border-radius:50%;background:var(--off-white);border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--border);}
.vc-tags{display:flex;gap:5px;flex-wrap:wrap;}
.vc-tag{padding:2px 7px;background:var(--blue-bg);border:1px solid var(--blue-pale);border-radius:10px;font-size:10px;color:var(--blue-primary);}
.vc-actions{display:flex;flex-direction:column;gap:5px;align-items:flex-end;}
.cmp-check{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-light);cursor:pointer;}
.cmp-check input{accent-color:var(--blue-primary);cursor:pointer;}
@media(max-width:560px){.vc{grid-template-columns:56px 1fr;}.vc-actions{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;justify-content:flex-end;}}
/* Breadcrumb */
.bc{display:flex;align-items:center;gap:6px;margin-bottom:14px;font-size:12px;color:var(--text-light);}
.bc a{color:var(--blue-primary);cursor:pointer;font-weight:600;text-decoration:none;}
.bc a:hover{text-decoration:underline;}
/* Report */
.rpt-card{background:white;border:1px solid var(--border);border-radius:14px;padding:28px;}
.rpt-hero{background:linear-gradient(135deg,var(--navy-dark),var(--navy-mid));border-radius:12px;padding:20px 26px;color:white;margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.rpt-name-txt{font-size:17px;font-weight:800;margin-bottom:3px;}
.rpt-meta-txt{font-size:11px;opacity:.65;line-height:1.8;}
.rpt-score-ring{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.rpt-score-num{font-size:22px;font-weight:800;}
.rpt-score-lbl{font-size:9px;opacity:.6;margin-top:-2px;}
.rpt-sec{margin-bottom:20px;}
.sec-title{font-size:13px;font-weight:800;color:var(--navy-mid);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--blue-pale);display:flex;align-items:center;gap:6px;}
.sec-title span{font-size:16px;}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
@media(max-width:480px){.info-grid{grid-template-columns:1fr 1fr;}}
.info-card{background:var(--off-white);border:1px solid var(--border);border-radius:8px;padding:9px 12px;}
.info-lbl{font-size:10px;color:var(--text-light);margin-bottom:2px;}
.info-val{font-size:13px;font-weight:700;color:var(--navy-dark);}
.eye-photos-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:14px;max-width:420px;}
.eye-photo-box{text-align:center;}
.eye-photo-lbl{font-size:11px;font-weight:700;color:var(--navy-mid);margin-bottom:7px;}
.eye-photo-wrap{position:relative;display:inline-block;border-radius:50%;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.18);}
.eye-photo-wrap img{width:150px;height:150px;object-fit:cover;display:block;}
.eye-photo-ann{position:absolute;top:0;left:0;width:150px;height:150px;pointer-events:none;}
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.zone-card{padding:9px 11px;border-radius:8px;border-left:3px solid;}
.zone-card.g{background:#F0FDF4;border-left-color:var(--success);}
.zone-card.w{background:#FFFBEB;border-left-color:var(--warning);}
.zone-card.o{background:#FFF7ED;border-left-color:var(--orange);}
.zone-card.r{background:#FEF2F2;border-left-color:var(--danger);}
.zn-name{font-size:10px;font-weight:700;color:var(--navy-mid);margin-bottom:2px;}
.zn-status{font-size:11px;font-weight:700;}
.zn-note{font-size:10px;color:var(--text-light);margin-top:2px;line-height:1.4;}
.tag-list{display:flex;flex-wrap:wrap;gap:5px;}
.tag{padding:3px 8px;background:var(--blue-bg);border:1px solid var(--blue-pale);border-radius:10px;font-size:11px;color:var(--blue-primary);font-weight:600;}
.tag-none{padding:3px 8px;background:var(--gray-light);border:1px solid var(--border);border-radius:10px;font-size:11px;color:var(--text-light);}
/* Notes */
.notes-box{background:var(--blue-bg);border:1.5px solid var(--blue-pale);border-radius:10px;padding:14px;margin-top:16px;}
.notes-lbl{font-size:11px;font-weight:700;color:var(--navy-mid);margin-bottom:7px;}
.notes-ta{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--text-dark);background:white;outline:none;font-family:inherit;resize:vertical;min-height:80px;line-height:1.6;transition:border-color .2s;}
.notes-ta:focus{border-color:var(--blue-primary);}
/* Comparison */
.cmp-header-row{display:grid;grid-template-columns:120px 1fr 40px 1fr;gap:0;align-items:center;margin-bottom:8px;}
.cmp-col-hdr{background:var(--navy-dark);color:white;border-radius:10px;padding:12px 14px;text-align:center;}
.cmp-col-date{font-size:10px;opacity:.65;margin-bottom:3px;}
.cmp-col-score{font-size:26px;font-weight:800;}
.cmp-zone-block{display:grid;grid-template-columns:120px 1fr 40px 1fr;gap:0;margin-bottom:5px;align-items:center;}
.cmp-zone-name{font-size:11px;font-weight:700;color:var(--navy-mid);padding-right:8px;}
.cmp-cell{padding:8px 10px;text-align:center;border-radius:7px;font-size:14px;font-weight:800;}
.cmp-arrow-cell{display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;padding:0 4px;}
/* Compare fab */
.cmp-fab{position:fixed;bottom:28px;right:28px;padding:12px 22px;border:none;border-radius:28px;background:var(--blue-primary);color:white;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 22px rgba(46,109,180,.45);z-index:50;font-family:inherit;display:flex;align-items:center;gap:8px;transition:all .2s;}
.cmp-fab:hover{background:var(--navy-light);transform:translateY(-2px);}
/* Buttons */
.btn-prim{padding:9px 18px;border:none;border-radius:8px;background:var(--blue-primary);color:white;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s;}
.btn-prim:hover{background:var(--navy-light);}
.btn-sec{padding:9px 18px;border:1.5px solid var(--border);border-radius:8px;background:white;color:var(--text-mid);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s;}
.btn-sec:hover{border-color:var(--navy-mid);}
.btn-danger{padding:9px 18px;border:none;border-radius:8px;background:var(--danger);color:white;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s;}
.btn-green{padding:9px 18px;border:none;border-radius:8px;background:var(--success);color:white;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s;}
/* Empty */
.empty{text-align:center;padding:56px 20px;}
.empty-ico{font-size:52px;margin-bottom:14px;}
.empty-tit{font-size:16px;font-weight:700;color:var(--navy-mid);margin-bottom:6px;}
.empty-dsc{font-size:13px;color:var(--text-light);line-height:1.7;}
.divider{height:1px;background:var(--border);margin:16px 0;}
/* Settings */
.settings-card{background:white;border:1px solid var(--border);border-radius:14px;padding:24px;max-width:420px;}
/* Pagination */
.pg-title{font-size:21px;font-weight:800;color:var(--navy-dark);margin-bottom:3px;}
.pg-desc{font-size:13px;color:var(--text-light);margin-bottom:20px;}
/* Print */
@media print{
  @page{size:A4 portrait;margin:8mm 10mm;}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  .sidebar,.hdr-back,.header-badge,.vc-actions,.bc,.cmp-fab,.mob-menu-btn,.mob-overlay,button{display:none!important;}
  .admin-wrap{display:block!important;}
  .main-content{padding:0!important;}
  #adminNotesArea{display:none!important;}
  .notes-ta{display:none!important;}
}
</style>
</head>
<body>

<header class="header">
  <a class="logo" href="index.html">
    <div class="logo-eye"><img src="ludia-logo.png" alt="LUDIA"></div>
    <div class="logo-info">
      <div class="logo-name">LUDIA HEALTH</div>
      <div class="logo-tagline">ADMIN PANEL</div>
    </div>
  </a>
  <div style="display:flex;align-items:center;gap:10px">
    <button class="mob-menu-btn" onclick="toggleSidebar()">☰</button>
    <a href="index.html" class="hdr-back">← 진단 시스템</a>
    <div class="header-badge" id="adminBadge">관리자</div>
  </div>
</header>

<div id="mobOverlay" class="mob-overlay" onclick="toggleSidebar()"></div>

<!-- Admin layout -->
<div id="adminLayout">
  <div class="admin-wrap">
    <aside class="sidebar" id="sidebar">
      <div class="sb-label">메인 메뉴</div>
      <div class="sb-link" id="sb-dashboard" onclick="navigate('dashboard')" style="display:none"><span class="sb-icon">📊</span> 대시보드</div>
      <div class="sb-link" id="sb-patients" onclick="navigate('patients')"><span class="sb-icon">🧑‍⚕️</span> 환자 관리</div>
      <div class="sb-link" id="sb-intake" onclick="navigate('intake')"><span class="sb-icon">📝</span> 상담 신청 <span id="intakeBadge" style="display:none;margin-left:auto;background:#EF4444;color:white;font-size:9px;font-weight:800;padding:1px 6px;border-radius:10px"></span></div>

      <!-- 최종관리자 전용 메뉴 -->
      <div id="super-menu" style="display:none">
        <div class="sb-div"></div>
        <div class="sb-label" style="color:#C4B5FD">최종관리자</div>
        <div class="sb-link" id="sb-members" onclick="navigate('members')"><span class="sb-icon">👤</span> 회원 관리</div>
        <div class="sb-link" id="sb-diagnose" onclick="location.href='index.html'"><span class="sb-icon">🔬</span> 진단하기</div>
        <div class="sb-link" id="sb-reports" onclick="navigate('reports')"><span class="sb-icon">📄</span> 전체 리포트</div>
        <div class="sb-link" id="sb-ai" onclick="navigate('ai')"><span class="sb-icon">🤖</span> AI 학습</div>
        <div class="sb-link" id="sb-iris" onclick="navigate('iris')"><span class="sb-icon">👁</span> 홍채 데이터셋</div>
      </div>

      <div class="sb-div"></div>
      <div class="sb-label">시스템</div>
      <div class="sb-link" id="sb-settings" onclick="navigate('settings')"><span class="sb-icon">⚙️</span> 설정</div>
      <div class="sb-div"></div>
      <div style="padding:8px 20px 4px;font-size:10px;color:rgba(255,255,255,.3);letter-spacing:1.5px;text-transform:uppercase;">계정</div>
      <div style="padding:6px 20px 10px;font-size:12px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:7px">
        <div style="width:22px;height:22px;border-radius:50%;background:var(--blue-primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;flex-shrink:0" id="adminInitial">A</div>
        <span id="adminNameSb" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      </div>
      <div class="sb-link" onclick="doLogout()"><span class="sb-icon">🔓</span> 로그아웃</div>
    </aside>
    <main class="main-content" id="content"></main>
  </div>
</div>

<div id="cmpFab" class="cmp-fab" style="display:none" onclick="doCompare()">
  <span>⚖️</span> <span id="cmpFabTxt">비교하기 (0/2)</span>
</div>

<script>
// ═══════════════════════════════════════
//  AUTH (session-based)
// ═══════════════════════════════════════
const adminSession = JSON.parse(sessionStorage.getItem('ludia_session') || localStorage.getItem('ludia_session') || 'null');
if (adminSession) sessionStorage.setItem('ludia_session', JSON.stringify(adminSession));
if (!adminSession || (adminSession.role !== 'admin' && adminSession.role !== 'super_admin')) { location.href = 'login.html'; }
const _IS_SUPER_ADMIN = adminSession && adminSession.role === 'super_admin';
// 최종 관리자 뱃지 표시
if (_IS_SUPER_ADMIN) {
  document.addEventListener('DOMContentLoaded', function() {
    const nameEls = document.querySelectorAll('[data-admin-name], .hdr-name, .admin-name');
    nameEls.forEach(el => {
      const badge = document.createElement('span');
      badge.style.cssText = 'margin-left:6px;padding:1px 7px;background:#7C3AED;color:white;border-radius:5px;font-size:9px;font-weight:800;letter-spacing:.5px';

const _LOCAL_MODE = location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';

async function apiPost(action, data = {}) {
  // 로컬 환경: api.php 없이 빈 성공 목 반환
  if (_LOCAL_MODE) {
    const LOCAL_MOCK = {
      get_patients: {patients: []},
      get_intake:   {intake: []},
      list_admins:  {admins: []},
      list_invite_codes: {codes: []},
      save_visit: {success: true, visitId: Date.now()},
      get_patient: {patient: null},
      get_visits:  {visits: []},
      delete_patient: {success: true},
      delete_intake:  {success: true},
      deliver_report:    {success: true},
      forward_patient:   {success: true},
      save_intake_memo:  {success: true},
      get_intake_photos: {success: true, photos: {left:'', right:''}},
    };
    return LOCAL_MOCK[action] || {success: true};
  }
  try {
    const resp = await fetch('api.php', {
      method: 'POST', credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action, ...data})
    });
    if (resp.status === 401) { sessionStorage.removeItem('ludia_session'); localStorage.removeItem('ludia_session'); location.href = 'login.html'; return {}; }
    return await resp.json();
  } catch(e) { return {error: '네트워크 오류: ' + e.message}; }
}

function sClass(v) { return v>=80?'g':v>=65?'w':v>=50?'o':'r'; }
function sColor(v) { return v>=80?'var(--success)':v>=65?'var(--warning)':v>=50?'var(--orange)':'var(--danger)'; }
function calcAge(dob) { if (!dob) return '–'; return Math.floor((new Date() - new Date(dob)) / 31557600000); }
function fmtDate(d) { if (!d) return '–'; return new Date(d).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}); }
function fmtDateShort(d) { if (!d) return '–'; return d.slice(0,10); }
function fmtDateTime(d) {
  if (!d) return '–';
  const dt = new Date(d);
  if (isNaN(dt)) return d.slice(0,10);
  return dt.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}) + ' ' +
    dt.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
}

function getOverall(visit) {
  if (visit.overallScore) return visit.overallScore;
  if (visit.scores) return Math.round(Object.values(visit.scores).reduce((a,b)=>a+b,0)/8);
  return 0;
}

function getThisMonthCount(records) {
  const now = new Date(), ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  let count = 0;
  records.forEach(p => p.visits?.forEach(v => { if ((v.date||'').startsWith(ym)) count++; }));
  return count;
}

function getThisWeekPatients(records) {
  const now = new Date();
  const day = now.getDay(); // 0=일, 1=월 ... 6=토
  const mon = new Date(now); mon.setDate(now.getDate() - ((day + 6) % 7)); mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6); sun.setHours(23,59,59,999);
  return records.filter(p => { const d = new Date(p.createdAt||0); return d >= mon && d <= sun; }).length;
}

function getThisMonthPatients(records) {
  const now = new Date();
  return records.filter(p => {
    const d = new Date(p.createdAt||0);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }).length;
}

function getRecentPatients(records, n = 8) {
  return [...records].sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||'')).slice(0, n);
}

function getRecentVisits(records, n = 5) {
  const all = [];
  records.forEach(p => p.visits?.forEach(v => all.push({...v, patientName: p.name, patientId: p.id})));
  return all.sort((a,b) => (b.date||'').localeCompare(a.date||'')).slice(0, n);
}

function renderPatients() {
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <div>
        <div class="pg-title" style="margin-bottom:2px">환자 관리</div>
        <div class="pg-desc" style="margin-bottom:0">등록된 환자를 관리하고 리포트를 확인합니다.</div>
      </div>
      <button class="btn-prim" onclick="openAddPatient()" style="flex-shrink:0;display:flex;align-items:center;gap:6px;padding:10px 18px;font-size:13px">
        <span style="font-size:16px">+</span> 환자 추가
      </button>
    </div>

    <!-- 필터 바 -->
    <div style="background:white;border:1px solid #E2E8F0;border-radius:12px;padding:12px 16px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-size:11px;font-weight:700;color:var(--text-light);flex-shrink:0">필터</span>
        <button id="ptfbtn_sx" onclick="setPtFilterCat('sx')"
          style="padding:5px 13px;border-radius:20px;border:1.5px solid ${_ptFilterCat==='sx'?'var(--blue-primary)':'#CBD5E1'};
            background:${_ptFilterCat==='sx'?'var(--blue-bg)':'white'};color:${_ptFilterCat==='sx'?'var(--blue-primary)':'var(--text-mid)'};
            font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">
          🩺 증상별
        </button>
        <button id="ptfbtn_dx" onclick="setPtFilterCat('dx')"
          style="padding:5px 13px;border-radius:20px;border:1.5px solid ${_ptFilterCat==='dx'?'var(--blue-primary)':'#CBD5E1'};
            background:${_ptFilterCat==='dx'?'var(--blue-bg)':'white'};color:${_ptFilterCat==='dx'?'var(--blue-primary)':'var(--text-mid)'};
            font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">
          🏥 질병별
        </button>
        ${_ptFilterId ? `<button onclick="clearPtFilter()"
          style="padding:5px 10px;border-radius:20px;border:1.5px solid #FCA5A5;background:#FEF2F2;color:#DC2626;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">
          ✕ 필터 해제
        </button>` : ''}
      </div>
      <div id="pt-filter-items" style="${_ptFilterCat?'':'display:none'}margin-top:10px;display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>

    <div class="tbl-card">
      <div class="tbl-hdr">
        <div class="tbl-card-title" id="ptCount">환자 ${getRecords().length}명</div>
        <input class="srch" id="searchInput" placeholder="이름, 연락처, 환자코드 검색..." value="${searchQ}">
      </div>
      <div id="patientsTable"></div>
    </div>`
    + addPatientModal();
}

function setPtFilterCat(cat) {
  if (_ptFilterCat === cat) { _ptFilterCat = null; _ptFilterId = null; }
  else { _ptFilterCat = cat; _ptFilterId = null; }
  renderPatientsFilterItems();
  renderPatientsTable();
  // update category button styles
  ['sx','dx'].forEach(c => {
    const b = document.getElementById('ptfbtn_' + c);
    if (!b) return;
    const on = _ptFilterCat === c;
    b.style.borderColor = on ? 'var(--blue-primary)' : '#CBD5E1';
    b.style.background  = on ? 'var(--blue-bg)'      : 'white';
    b.style.color       = on ? 'var(--blue-primary)'  : 'var(--text-mid)';
  });
}

function clearPtFilter() {
  _ptFilterCat = null; _ptFilterId = null;
  renderPatientsFilterItems();
  renderPatientsTable();
  ['sx','dx'].forEach(c => {
    const b = document.getElementById('ptfbtn_' + c);
    if (!b) return;
    b.style.borderColor='#CBD5E1'; b.style.background='white'; b.style.color='var(--text-mid)';
  });
}

function renderPatientsFilterItems() {
  const wrap = document.getElementById('pt-filter-items');
  if (!wrap) return;
  if (!_ptFilterCat) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';

  const records = getRecords();
  let items = [];
  if (_ptFilterCat === 'sx') {
    // collect all unique symptom IDs across all visits
    const counts = {};
    records.forEach(p => (p.visits||[]).forEach(v => (v.symptoms||[]).forEach(id => { counts[id] = (counts[id]||0)+1; })));
    items = Object.entries(SX_LABELS).filter(([id]) => counts[id]).map(([id,label]) => ({id, label, count: counts[id]||0}));
    // group by axis
    const axisOrder = ['s1','s2','s3','s4','s5'];
    items.sort((a,b) => axisOrder.indexOf(a.id.slice(0,2)) - axisOrder.indexOf(b.id.slice(0,2)));
  } else {
    const counts = {};
    records.forEach(p => (p.visits||[]).forEach(v => (v.pastConditions||[]).forEach(id => { counts[id] = (counts[id]||0)+1; })));
    items = Object.entries(PMH_LABELS).filter(([id]) => counts[id]).map(([id,label]) => ({id, label, count: counts[id]||0}));
  }

  wrap.innerHTML = items.map(({id,label,count}) => {
    const on = _ptFilterId === id;
    return `<button onclick="setPtFilterId('${id}')"
      style="padding:4px 11px;border-radius:16px;border:1.5px solid ${on?'var(--blue-primary)':'#CBD5E1'};
        background:${on?'var(--blue-primary)':'white'};color:${on?'white':'var(--text-mid)'};
        font-size:11px;font-weight:${on?700:500};cursor:pointer;font-family:inherit;white-space:nowrap">
      ${label} <span style="opacity:.7;font-size:10px">(${count})</span>
    </button>`;
  }).join('') || '<span style="font-size:12px;color:var(--text-light)">데이터 없음</span>';
}

function setPtFilterId(id) {
  _ptFilterId = (_ptFilterId === id) ? null : id;
  renderPatientsFilterItems();
  renderPatientsTable();
}

function renderPatientsTable() {
  const records = getRecords();
  const q = searchQ.toLowerCase();
  let filtered = q ? records.filter(p => (p.name||'').toLowerCase().includes(q) || (p.phone||'').includes(q)) : records;
  // 증상/질병 필터 적용
  if (_ptFilterId) {
    filtered = filtered.filter(p => (p.visits||[]).some(v => {
      if (_ptFilterCat === 'sx')  return (v.symptoms||[]).includes(_ptFilterId);
      if (_ptFilterCat === 'dx')  return (v.pastConditions||[]).includes(_ptFilterId);
      return false;
    }));
  }

  const el = document.getElementById('patientsTable');
  const countEl = document.getElementById('ptCount');
  if (countEl) countEl.textContent = `환자 ${filtered.length}명${_ptFilterId ? ` (필터: ${(SX_LABELS[_ptFilterId]||PMH_LABELS[_ptFilterId]||_ptFilterId)})` : ''}`;

  if (!el) return;
  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty"><div class="empty-ico">${q ? '🔍' : '👥'}</div>
      <div class="empty-tit">${q ? '검색 결과 없음' : '등록된 환자 없음'}</div>
      <div class="empty-dsc">${q ? `'${searchQ}'에 해당하는 환자가 없습니다.` : '진단 시스템에서 기록을 저장하면 여기에 표시됩니다.'}</div></div>`;
    return;
  }

  const rows = filtered.sort((a,b) => {
    const la = a.visits?.[a.visits.length-1]?.date || '';
    const lb = b.visits?.[b.visits.length-1]?.date || '';
    return lb.localeCompare(la);
  }).map(p => {
    const visits = p.visits || [];
    const last = visits[visits.length - 1];
    const prev = visits[visits.length - 2];
    const lastScore = last ? getOverall(last) : null;
    const prevScore = prev ? getOverall(prev) : null;
    const diff = lastScore != null && prevScore != null ? lastScore - prevScore : null;
    const trendHtml = diff == null ? '<span class="trend-fl">–</span>'
      : diff > 0 ? `<span class="trend-up">↑ +${diff}</span>`
      : diff < 0 ? `<span class="trend-dn">↓ ${diff}</span>`
      : '<span class="trend-fl">→ 0</span>';
    const hasReport = visits.some(v => v.reportBy);
    const adminName = p.createdByName || '–';
    const _destUrl = IS_SUPER && last ? `index.html?record=${p.id}&visit=${last.id}&iris=true` : null;
    return `<tr onclick="${_destUrl ? `location.href='${_destUrl}'` : `navigate('patient','${p.id}')`}" style="cursor:pointer">
      <td>
        <span style="font-size:10px;font-weight:700;color:var(--blue-primary);background:var(--blue-bg);padding:2px 7px;border-radius:4px;display:inline-block;margin-bottom:3px">${p.uniqueId||'–'}</span><br>
        <strong>${p.name || '–'}</strong>
        ${hasReport && !IS_SUPER ? '<span style="font-size:9px;font-weight:800;color:#059669;background:#D1FAE5;padding:1px 6px;border-radius:4px;margin-left:4px">리포트 완성</span>' : ''}
      </td>
      ${IS_SUPER ? `<td style="font-size:12px"><strong style="color:var(--navy-dark)">${adminName}</strong></td>` : ''}
      <td style="font-size:12px;color:var(--text-light)">${fmtDateTime(p.createdAt)}</td>
      <td>${p.dob || '–'}</td>
      <td>${calcAge(p.dob)}세</td>
      <td>${GENDER_KO[p.gender] || '–'}</td>
      <td>${last ? fmtDateShort(last.date) : '–'}</td>
      <td>${lastScore != null ? `<span class="scr-badge scr-${sClass(lastScore)}">${lastScore}</span>` : '–'}</td>
      <td>${trendHtml}</td>
      <td>${visits.length}회</td>
      <td style="display:flex;gap:5px;align-items:center">
        <button class="act-btn" onclick="event.stopPropagation();navigate('patient','${p.id}')">상세</button>
        <button class="act-btn" onclick="event.stopPropagation();openEditPatient('${p.id}')" style="background:#F0FDF4;color:#059669;border-color:#6EE7B7">수정</button>
      </td>
    </tr>`;
  }).join('');

  el.innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr><th>고유번호 / 이름</th>${IS_SUPER ? '<th>등록 관리자</th>' : ''}<th>등록일시</th><th>생년월일</th><th>나이</th><th>성별</th><th>마지막 방문</th><th>최근 점수</th><th>추세</th><th>방문</th><th>작업</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

// ═══════════════════════════════════════
//  SCORE CHART (SVG)
// ═══════════════════════════════════════
function renderScoreChart(visits) {
  const W = 600, H = 180, pL = 40, pR = 16, pT = 24, pB = 32;
  const cW = W - pL - pR, cH = H - pT - pB;
  const scores = visits.map(v => getOverall(v));
  const minS = Math.max(0, Math.min(...scores) - 10);
  const maxS = Math.min(100, Math.max(...scores) + 10);
  const xStep = visits.length > 1 ? cW / (visits.length - 1) : cW / 2;
  const yScale = cH / (maxS - minS || 1);
  const pts = visits.map((v, i) => ({ x: pL + i * xStep, y: pT + cH - (getOverall(v) - minS) * yScale, score: getOverall(v), date: v.date }));
  const pathD = pts.map((p, i) => `${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaD = pts.map((p, i) => `${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ') + ` L${pts[pts.length-1].x.toFixed(1)},${(pT+cH).toFixed(1)} L${pL},${(pT+cH).toFixed(1)} Z`;
  let grids = '';
  for (let y = Math.ceil(minS/20)*20; y <= maxS; y += 20) {
    const gy = (pT + cH - (y - minS) * yScale).toFixed(1);
    grids += `<line x1="${pL}" y1="${gy}" x2="${pL+cW}" y2="${gy}" stroke="#E2EAF2" stroke-width="1"/>
      <text x="${pL-6}" y="${parseFloat(gy)+4}" text-anchor="end" font-size="10" fill="#9CA3AF">${y}</text>`;
  }
  const xLabels = pts.map(p => `<text x="${p.x.toFixed(1)}" y="${(pT+cH+18).toFixed(1)}" text-anchor="middle" font-size="9" fill="#9CA3AF">${(p.date||'').slice(5)}</text>`).join('');
  const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="${sColor(p.score)}" stroke="white" stroke-width="2"/>
    <text x="${p.x.toFixed(1)}" y="${(p.y-10).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="${sColor(p.score)}">${p.score}</text>`).join('');
  return `<div style="overflow-x:auto"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2E6DB4" stop-opacity="0.25"/><stop offset="100%" stop-color="#2E6DB4" stop-opacity="0.03"/></linearGradient></defs>
    ${grids}
    <path d="${areaD}" fill="url(#sg)"/>
    <path d="${pathD}" fill="none" stroke="#2E6DB4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${xLabels}
  </svg></div>`;
}

function simpleHash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h) ^ str.charCodeAt(i);
  return (h >>> 0).toString(36);
}

async function createAdminAccount() {
  const name  = (document.getElementById('newAdminName').value  || '').trim();
  const email = (document.getElementById('newAdminEmail').value || '').trim().toLowerCase();
  const pw    = (document.getElementById('newAdminPw').value    || '').trim();
  const phone = (document.getElementById('newAdminPhone').value || '').replace(/\D/g,'');
  if (!name||!email||!pw||!phone){alert('이름, 이메일, 비밀번호, 핸드폰 번호를 모두 입력해주세요.');return;}
  if (pw.length<6){alert('비밀번호는 6자 이상이어야 합니다.');return;}
  if (phone.length<7){alert('핸드폰 번호를 올바르게 입력해주세요.');return;}
  const result = await apiPost('create_admin', {name, email, password:pw, phone});
  if (!result.success){alert('생성 실패: '+(result.error||'알 수 없는 오류'));return;}
  const ac = result.admin?.admin_code || '';
  await reloadData();
  alert(`관리자 계정 생성 완료!\n이름: ${name}\n이메일: ${email}\n관리자 코드: ${ac}`);
  navigate('members');
}

async function deleteAdmin(uid) {
  if (!confirm('이 관리자 계정을 삭제하시겠습니까?')) return;
  const result = await apiPost('delete_admin', {id: uid});
  if (!result.success){alert('삭제 실패: '+(result.error||''));return;}
  await reloadData(); navigate('members');
}

function renderReports() {
  const records = getAllRecords();
  const allVisits = records.flatMap(p =>
    (p.visits || []).map(v => ({ ...v, patientName: p.name, patientId: p.id }))
  ).sort((a, b) => new Date(b.date) - new Date(a.date));

  const rows = allVisits.length === 0
    ? `<tr><td colspan="6" style="text-align:center;color:var(--text-light);padding:24px">리포트 없음</td></tr>`
    : allVisits.map(v => {
        const sc = getOverall(v);
        const done = !!v.reportBy;
        return `<tr style="cursor:pointer" onclick="location.href='index.html?record=${v.patientId}&visit=${v.id}${done?"":"&iris=true"}'">
          <td><strong>${v.patientName || '–'}</strong></td>
          <td style="font-size:12px;color:var(--text-light)">${v.registeredBy?.name || '–'}</td>
          <td style="font-size:12px">${fmtDateShort(v.date)}</td>
          <td><span class="scr-badge scr-${sClass(sc)}">${sc}</span></td>
          <td>${done
            ? '<span style="font-size:10px;font-weight:800;color:#059669;background:#D1FAE5;padding:2px 8px;border-radius:4px">완성</span>'
            : '<span style="font-size:10px;font-weight:700;color:#D97706;background:#FEF3C7;padding:2px 8px;border-radius:4px">미완성</span>'}</td>
          <td><button class="act-btn" onclick="event.stopPropagation();location.href='index.html?record=${v.patientId}&visit=${v.id}&iris=true'" style="background:#F5F3FF;color:#7C3AED;border-color:#DDD6FE">열기</button></td>
        </tr>`;
      }).join('');

  const doneCount = allVisits.filter(v => !!v.reportBy).length;

  return `
    <div class="pg-title">전체 리포트</div>
    <div class="pg-desc">모든 환자의 진단 리포트를 통합 조회합니다.</div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px">
      <div class="stat-card stat-blue"><div class="stat-lbl">전체 진단 수</div><div class="stat-num">${allVisits.length}<span style="font-size:14px;font-weight:400;color:var(--text-light)"> 건</span></div></div>
      <div class="stat-card stat-green"><div class="stat-lbl">완성된 리포트</div><div class="stat-num">${doneCount}<span style="font-size:14px;font-weight:400;color:var(--text-light)"> 건</span></div></div>
      <div class="stat-card stat-orange"><div class="stat-lbl">미완성 리포트</div><div class="stat-num">${allVisits.length - doneCount}<span style="font-size:14px;font-weight:400;color:var(--text-light)"> 건</span></div></div>
    </div>

    <div class="tbl-card">
      <div class="tbl-hdr"><div class="tbl-card-title">📄 리포트 목록</div></div>
      <div class="tbl-wrap"><table>

function renderIrisDataset() {
  // 전체 홍채 목록 수집
  const records = getRecords();
  const allIrises = []; // {patientId, patientName, visitId, date, side, src, sxIds, dxIds, axisScores}
  records.forEach(p => {
    (p.visits||[]).forEach(v => {
      const base = {
        patientId: p.id, patientName: p.name||'–', visitId: v.id,
        date: v.date||'', sxIds: v.symptoms||[], dxIds: v.pastConditions||[],
        axisScores: v.scores||null
      };
      if (v.leftEyePhoto)  allIrises.push({...base, side:'L', src: v.leftEyePhoto});
      if (v.rightEyePhoto) allIrises.push({...base, side:'R', src: v.rightEyePhoto});
      // also check irisPhotos (patient-level)
      const lp = Array.isArray(p.irisPhotos?.left)  ? p.irisPhotos.left[0]  : p.irisPhotos?.left;
      const rp = Array.isArray(p.irisPhotos?.right) ? p.irisPhotos.right[0] : p.irisPhotos?.right;
      if (lp && !v.leftEyePhoto)  allIrises.push({...base, side:'L', src: lp});
      if (rp && !v.rightEyePhoto) allIrises.push({...base, side:'R', src: rp});
    });
  });

  // 필터 적용
  let shown = allIrises;
  if (_irisFilterId) {
    shown = allIrises.filter(ir => {
      if (_irisFilterCat === 'sx') return ir.sxIds.includes(_irisFilterId);
      if (_irisFilterCat === 'dx') return ir.dxIds.includes(_irisFilterId);
      return true;
    });
  }

  // 증상 카운트 (필터 버튼 뱃지용)
  const sxCounts = {}, dxCounts = {};
  allIrises.forEach(ir => {
    ir.sxIds.forEach(id => { sxCounts[id] = (sxCounts[id]||0)+1; });
    ir.dxIds.forEach(id => { dxCounts[id] = (dxCounts[id]||0)+1; });
  });

  // 그룹핑: _irisGroupBy가 true면 선택한 태그별로 섹션 분리
  let gallery = '';
  if (_irisGroupBy && _irisFilterCat && !_irisFilterId) {
    const labels = _irisFilterCat === 'sx' ? SX_LABELS : PMH_LABELS;
    const counts  = _irisFilterCat === 'sx' ? sxCounts : dxCounts;
    Object.entries(labels).filter(([id]) => counts[id]).forEach(([id, label]) => {
      const group = allIrises.filter(ir => (_irisFilterCat==='sx' ? ir.sxIds : ir.dxIds).includes(id));
      gallery += `<div style="margin-bottom:28px">
        <div style="font-size:13px;font-weight:800;color:var(--navy-dark);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--border)">
          ${label} <span style="font-size:11px;font-weight:400;color:var(--text-light)">${group.length}장</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px">
          ${group.map(ir => irisCard(ir)).join('')}
        </div>
      </div>`;
    });
  } else {
    gallery = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px">
      ${shown.length ? shown.map(ir => irisCard(ir)).join('') : '<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--text-light)">해당 조건의 홍채 이미지가 없습니다</div>'}
    </div>`;
  }

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <div>
        <div class="pg-title" style="margin-bottom:2px">👁 홍채 데이터셋</div>
        <div class="pg-desc" style="margin-bottom:0">환자 홍채 이미지를 증상·질병별로 분류하여 딥러닝 학습 데이터를 구축합니다. 총 <strong>${allIrises.length}장</strong></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button onclick="_irisGroupBy=!_irisGroupBy;navigate('iris')"
          style="padding:7px 14px;border-radius:8px;border:1.5px solid ${_irisGroupBy?'var(--blue-primary)':'#CBD5E1'};
            background:${_irisGroupBy?'var(--blue-bg)':'white'};color:${_irisGroupBy?'var(--blue-primary)':'var(--text-mid)'};
            font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">
          묶어보기 ${_irisGroupBy?'ON':'OFF'}
        </button>
        <button onclick="exportIrisDataset()" style="padding:7px 14px;border-radius:8px;border:1.5px solid #CBD5E1;background:white;color:var(--text-mid);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">
          📥 라벨 CSV 내보내기
        </button>
      </div>
    </div>

    <!-- 필터 패널 -->
    <div style="background:white;border:1px solid #E2E8F0;border-radius:12px;padding:12px 16px;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:${_irisFilterCat?'10px':'0'}">
        <span style="font-size:11px;font-weight:700;color:var(--text-light);flex-shrink:0">필터</span>
        <button id="irisfbtn_all" onclick="setIrisFilter(null,null)"
          style="padding:5px 13px;border-radius:20px;border:1.5px solid ${!_irisFilterCat?'var(--blue-primary)':'#CBD5E1'};
            background:${!_irisFilterCat?'var(--blue-bg)':'white'};color:${!_irisFilterCat?'var(--blue-primary)':'var(--text-mid)'};
            font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">전체 (${allIrises.length})</button>
        <button id="irisfbtn_sx" onclick="setIrisFilter('sx',null)"
          style="padding:5px 13px;border-radius:20px;border:1.5px solid ${_irisFilterCat==='sx'?'var(--blue-primary)':'#CBD5E1'};
            background:${_irisFilterCat==='sx'?'var(--blue-bg)':'white'};color:${_irisFilterCat==='sx'?'var(--blue-primary)':'var(--text-mid)'};
            font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">🩺 증상별</button>
        <button id="irisfbtn_dx" onclick="setIrisFilter('dx',null)"
          style="padding:5px 13px;border-radius:20px;border:1.5px solid ${_irisFilterCat==='dx'?'var(--blue-primary)':'#CBD5E1'};
            background:${_irisFilterCat==='dx'?'var(--blue-bg)':'white'};color:${_irisFilterCat==='dx'?'var(--blue-primary)':'var(--text-mid)'};
            font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">🏥 질병별</button>
        ${_irisFilterId ? `<button onclick="setIrisFilter(_irisFilterCat,null)"
          style="padding:5px 10px;border-radius:20px;border:1.5px solid #FCA5A5;background:#FEF2F2;color:#DC2626;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">✕ 필터 해제</button>` : ''}
      </div>
      <div id="iris-filter-items" style="${_irisFilterCat?'':'display:none'}display:flex;flex-wrap:wrap;gap:6px">
        ${_irisFilterCat ? renderIrisFilterItems(sxCounts, dxCounts) : ''}
      </div>
    </div>

    <!-- 갤러리 -->
    <div class="tbl-card">
      <div style="font-size:13px;font-weight:700;color:var(--navy-dark);margin-bottom:12px">
        ${_irisFilterId ? `${SX_LABELS[_irisFilterId]||PMH_LABELS[_irisFilterId]} — ${shown.length}장` : `전체 ${shown.length}장`}
      </div>
      ${gallery}
    </div>`;
}

function renderIrisFilterItems(sxCounts, dxCounts) {
  const counts = _irisFilterCat === 'sx' ? sxCounts : dxCounts;
  const labels = _irisFilterCat === 'sx' ? SX_LABELS : PMH_LABELS;
  return Object.entries(labels).filter(([id]) => counts[id]).map(([id,label]) => {
    const on = _irisFilterId === id;
    return `<button onclick="setIrisFilter('${_irisFilterCat}','${id}')"
      style="padding:4px 11px;border-radius:16px;border:1.5px solid ${on?'var(--blue-primary)':'#CBD5E1'};
        background:${on?'var(--blue-primary)':'white'};color:${on?'white':'var(--text-mid)'};
        font-size:11px;font-weight:${on?700:500};cursor:pointer;font-family:inherit;white-space:nowrap">
      ${label} <span style="opacity:.7;font-size:10px">(${counts[id]})</span>
    </button>`;
  }).join('');
}

function irisCard(ir) {
  const sxTags = ir.sxIds.slice(0,3).map(id => SX_LABELS[id]||id).join('·');
  const dxTags = ir.dxIds.slice(0,2).map(id => PMH_LABELS[id]||id).join('·');
  return `<div style="border:1.5px solid #E2E8F0;border-radius:10px;overflow:hidden;cursor:pointer;transition:box-shadow .15s"
    onclick="location.href='index.html?record=${ir.patientId}&visit=${ir.visitId}&iris=true'"
    onmouseover="this.style.boxShadow='0 4px 16px rgba(0,0,0,.12)'" onmouseout="this.style.boxShadow=''">
    <div style="position:relative;aspect-ratio:1;background:#0A1628;overflow:hidden">
      <img src="${ir.src}" alt="홍채" style="width:100%;height:100%;object-fit:cover;display:block"

      <div style="position:absolute;top:5px;left:5px;background:rgba(0,0,0,.6);color:white;font-size:9px;font-weight:800;
        padding:2px 6px;border-radius:5px">${ir.side==='L'?'좌':'우'}</div>
      <div style="position:absolute;bottom:5px;right:5px;background:rgba(10,22,40,.7);color:#93C5FD;font-size:9px;
        padding:2px 6px;border-radius:5px">${fmtDateShort(ir.date)}</div>
    </div>
    <div style="padding:7px 8px;background:white">
      <div style="font-size:11px;font-weight:700;color:var(--navy-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ir.patientName}</div>
      ${sxTags ? `<div style="font-size:9.5px;color:#0369A1;margin-top:2px;line-height:1.3;overflow:hidden;max-height:28px">${sxTags}</div>` : ''}
      ${dxTags ? `<div style="font-size:9.5px;color:#7C3AED;margin-top:1px;line-height:1.3;overflow:hidden;max-height:20px">${dxTags}</div>` : ''}
    </div>
  </div>`;
}

function setIrisFilter(cat, id) {
  _irisFilterCat = cat; _irisFilterId = id;
  navigate('iris');
}

function exportIrisDataset() {
  const records = getRecords();
  const rows = [['patient_id','patient_name','visit_id','date','side','symptoms','diseases','axis1','axis2','axis3','axis4','axis5']];
  records.forEach(p => {
    (p.visits||[]).forEach(v => {
      ['L','R'].forEach(side => {
        const src = side==='L' ? v.leftEyePhoto : v.rightEyePhoto;
        if (!src) return;
        const sc = v.scores||{};
        rows.push([
          p.id, p.name||'', v.id, v.date||'', side,
          (v.symptoms||[]).map(id=>SX_LABELS[id]||id).join('|'),
          (v.pastConditions||[]).map(id=>PMH_LABELS[id]||id).join('|'),
          sc.axis1||'', sc.axis2||'', sc.axis3||'', sc.axis4||'', sc.axis5||''
        ]);
      });
    });
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,﻿' + encodeURIComponent(csv);
  a.download = 'ludia_iris_dataset_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

async function adminLoadCasesFromDB() {
  const axClr = {1:'#7C3AED',2:'#1D4ED8',3:'#059669',4:'#D97706',5:'#DC2626'};
  const GOAL = 100;
  try {
    const res = await apiPost('get_similar_cases', { axis1:0,axis2:0,axis3:0,axis4:0,axis5:0, path_number:0, top_n:500 });
    const cases = res.cases || [];
    const n = cases.length;
    const pct = Math.min(100, Math.round(n / GOAL * 100));

    const cnt  = document.getElementById('ai-case-count');
    const cnt2 = document.getElementById('ai-case-count2');
    const rem  = document.getElementById('ai-case-remaining');
    const bar  = document.getElementById('ai-progress-bar');
    const lbl  = document.getElementById('ai-progress-label');
    if (cnt)  cnt.textContent  = n;
    if (cnt2) cnt2.textContent = n;
    if (rem)  rem.textContent  = Math.max(0, GOAL - n);

    const listEl = document.getElementById('ai-cases-list');

      listEl.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-light);font-size:13px">보고서를 완성하면 케이스가 여기에 쌓입니다.</div>`;

    listEl.innerHTML = `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">

          <td style="padding:6px 10px;font-size:11px;color:var(--text-light)">${(c.created_at||'').slice(0,10)}</td>
          <td style="padding:6px 10px">
            <span style="font-size:10px;font-weight:800;color:${axClr[primary]||'#64748B'};background:${axClr[primary]||'#64748B'}18;padding:2px 8px;border-radius:4px">
              경로 ${ax}
            </span>
          </td>
          ${[1,2,3,4,5].map(i => `<td style="padding:6px 10px;text-align:center;font-size:11px;font-weight:700;color:${axClr[i]}">${c['axis'+i]!=null ? Math.round(c['axis'+i]) : '–'}</td>`).join('')}
        </tr>`;
      }).join('')}</tbody>
    </table></div>
    ${cases.length > 50 ? `<div style="text-align:center;padding:10px;font-size:11px;color:var(--text-light)">최근 50개 표시 (전체 ${cases.length}개)</div>` : ''}`;
  } catch(e) {
    const listEl = document.getElementById('ai-cases-list');
    if (listEl) listEl.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-light);font-size:13px">케이스 로드 실패</div>`;
  }
}

function getRecordsFor(userId) {
  return getAllRecords().filter(p => p.createdBy === userId);
}

            <button onclick="closeIrisCamera()" style="padding:10px 18px;background:#059669;border:none;border-radius:8px;font-size:12px;font-weight:700;color:white;cursor:pointer">✓ 완료</button>
          </div>
          <canvas id="irisCamCanvas" style="display:none"></canvas>
        </div>

        <div style="display:flex;justify-content:space-between;margin-top:8px">
          <button onclick="goAddStep(2)" class="btn-sec">← 이전</button>
          <button onclick="saveNewPatient()" class="btn-prim" style="background:#059669;border-color:#059669">✓ 환자 등록 완료</button>
        </div>
      </div>

    </div>
  </div>`;
}

function _inputStyle(size) {
  const pad = size === 'sm' ? '7px 10px' : '9px 12px';
  return `width:100%;padding:${pad};border:1px solid #E2E8F0;border-radius:8px;font-size:13px;font-family:inherit;box-sizing:border-box;`;
}

// ── 증상 토글 ───────────────────────────────────────────────────────
const _symSelected = new Set();
function toggleSym(key, el) {
  if (_symSelected.has(key)) {
    _symSelected.delete(key);
    el.style.borderColor = '#E2E8F0';
    el.style.background  = '';
    const dot = document.getElementById('dot_' + key);
    if (dot) { dot.style.background = ''; dot.style.borderColor = '#CBD5E1'; }
  } else {
    _symSelected.add(key);
    el.style.borderColor = 'var(--navy-mid)';
    el.style.background  = '#EFF6FF';
    const dot = document.getElementById('dot_' + key);
    if (dot) { dot.style.background = 'var(--navy-mid)'; dot.style.borderColor = 'var(--navy-mid)'; }
  }
}

// ── 과거력 토글 ─────────────────────────────────────────────────────
const _pmhSelected = new Set();
function togglePmh(key, el) {
  if (_pmhSelected.has(key)) {
    _pmhSelected.delete(key);
    el.style.borderColor = '#E2E8F0';
    el.style.background  = '';
    const dot = document.getElementById('pmhdot_' + key);
    if (dot) { dot.style.background = ''; dot.style.borderColor = '#CBD5E1'; }
  } else {
    _pmhSelected.add(key);
    el.style.borderColor = '#7C3AED';
    el.style.background  = '#F5F3FF';
    const dot = document.getElementById('pmhdot_' + key);
    if (dot) { dot.style.background = '#7C3AED'; dot.style.borderColor = '#7C3AED'; }
  }
}

// ── 복용 약물 동적 행 ────────────────────────────────────────────────

// ── 약물/수술 데이터 수집 ────────────────────────────────────────────
function collectMeds() {
  const rows = document.querySelectorAll('[id^="med_"]:not([id*="_period"])');
  return Array.from(rows).map(row => {
    const inputs = row.querySelectorAll('input[type="text"]');
    return { name: inputs[0]?.value?.trim() || '', period: inputs[1]?.value?.trim() || '' };
  }).filter(m => m.name);
}
function collectSurg() {
  const rows = document.querySelectorAll('[id^="surg_"]:not([id*="_year"])');
  return Array.from(rows).map(row => {
    const inputs = row.querySelectorAll('input[type="text"]');
    return { name: inputs[0]?.value?.trim() || '', year: inputs[1]?.value?.trim() || '' };
  }).filter(s => s.name);
}

let _editPatient   = null;

// ── 수정 모드 단계별 데이터 채우기 ──────────────────────────────────
function _prefillStep(n) {
  const p = _editPatient; if (!p) return;
  if (n === 1) {
    document.getElementById('af_name').value  = p.name  || '';
    document.getElementById('af_phone').value = p.phone || '';
    document.getElementById('af_dob').value   = p.dob   || '';
    document.getElementById('af_gender').value    = p.gender     || '';
    document.getElementById('af_addr').value      = p.address    || '';
    document.getElementById('af_job').value       = p.occupation || '';
    document.getElementById('af_email').value     = p.email      || '';
    document.getElementById('af_code_preview').textContent = p.uniqueId || '–';
  } else if (n === 2) {
    const s = p.survey || {};
    // 증상 칩 선택
    (s.symptoms || []).forEach(key => {
      const el = document.getElementById('chip_' + key);
      if (el && !_symSelected.has(key)) toggleSym(key, el);
    });
    // 생활습관 드롭다운
    ['sleep','stress','exercise','smoking','alcohol'].forEach(k => {
      const el = document.getElementById('af_' + k);
      if (el && s[k]) el.value = s[k];
    });
    // VAS
    const vas = document.getElementById('af_vas');
    if (vas && s.vasScore != null) { vas.value = s.vasScore; const vv = document.getElementById('af_vas_val'); if (vv) vv.textContent = s.vasScore; }
    // 복용 약물
    (s.medications || []).forEach(m => {
      addMedRow();
      const rows = document.querySelectorAll('#med_list > div');
      const row = rows[rows.length - 1]; if (!row) return;
      const inp = row.querySelectorAll('input[type="text"]');
      if (inp[0]) inp[0].value = m.name   || '';
      if (inp[1]) inp[1].value = m.period || '';
    });
    // 수술력
    (s.surgeries || []).forEach(sv => {
      addSurgRow();
      const rows = document.querySelectorAll('#surg_list > div');
      const row = rows[rows.length - 1]; if (!row) return;
      const inp = row.querySelectorAll('input[type="text"]');
      if (inp[0]) inp[0].value = sv.name || '';
      if (inp[1]) inp[1].value = sv.year || '';
    });
    // 과거력 칩
    (s.pastHistory || []).forEach(key => {
      const el = document.getElementById('pmhchip_' + key);
      if (el && !_pmhSelected.has(key)) togglePmh(key, el);
    });
    // 메모
    const memo = document.getElementById('af_memo');
    if (memo) memo.value = s.memo || '';
    // 설문지 사진
    if (s.surveyPhoto) {
      const prev = document.getElementById('survey_photo_preview');
      if (prev) prev.innerHTML = `<img src="${s.surveyPhoto}" style="max-width:100%;border-radius:8px;border:1px solid #E2E8F0">`;
    }
  } else if (n === 3) {
    _updateIrisPreview('L');
    _updateIrisPreview('R');
  }
}

// ── 설문지 사진 프리뷰 ──────────────────────────────────────────────
function previewSurveyPhoto(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    _addData.surveyPhoto = e.target.result;
    document.getElementById('survey_photo_preview').innerHTML =
      `<img src="${e.target.result}" style="max-width:100%;border-radius:8px;border:1px solid #E2E8F0">`;
  };
  reader.readAsDataURL(file);
}

// ── 홍채 사진 업로드 (다중 파일 지원) ───────────────────────────────
function setIrisPhoto(side, input) {
  const files = Array.from(input.files); if (!files.length) return;
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      _irisCaptures[side].push(e.target.result);
      loaded++;
      if (loaded === files.length) {
        _updateIrisPreview(side);
      }
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

// ── 홍채 카메라 (다중 촬영) ──────────────────────────────────────────
let _irisSide    = 'L';
let _facingMode  = 'environment';
let _irisCaptures = { L: [], R: [] };  // 각 안에 캡처된 이미지 배열

function _irisSpaceHandler(e) {
  if (e.code === 'Space' && document.getElementById('irisCamBox')?.style.display !== 'none') {
    e.preventDefault();
    captureIris();
  }
}

async function openIrisCapture(side) {
  _irisSide = side;
  const label = side === 'L' ? '👁 좌안 (Left) — 연속 촬영' : '👁 우안 (Right) — 연속 촬영';
  document.getElementById('irisCamLabel').textContent = label;
  document.getElementById('irisCamBox').style.display = 'block';
  _refreshStrip();
  document.addEventListener('keydown', _irisSpaceHandler);
  await startCamera();
}

let _selectedDeviceId = '';

async function _populateCameraList() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoDevices = devices.filter(d => d.kind === 'videoinput');
    const sel = document.getElementById('irisCamSelect');
    if (!sel) return;
    sel.innerHTML = '';
    videoDevices.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || `카메라 ${i + 1}`;
      opt.style.background = '#0A1628';
      if (d.deviceId === _selectedDeviceId) opt.selected = true;
      sel.appendChild(opt);
    });
    if (!_selectedDeviceId && videoDevices.length) {
      _selectedDeviceId = videoDevices[0].deviceId;
      sel.value = _selectedDeviceId;
    }
  } catch(e) {}
}

async function startCamera() {
  try {
    if (_irisStream) _irisStream.getTracks().forEach(t => t.stop());
    const constraints = { video: { width: { ideal: 1920 }, height: { ideal: 1920 } } };
    if (_selectedDeviceId) constraints.video.deviceId = { exact: _selectedDeviceId };
    _irisStream = await navigator.mediaDevices.getUserMedia(constraints);
    document.getElementById('irisCamVideo').srcObject = _irisStream;
    // 권한 허용 후 장치 목록 재조회 (레이블 표시됨)
    await _populateCameraList();
  } catch(e) {
    alert('카메라 접근 실패. 브라우저 권한을 허용해주세요.\n오류: ' + e.message);
    closeIrisCamera();
  }
}

async function switchCameraDevice(deviceId) {
  _selectedDeviceId = deviceId;
  await startCamera();
}

function captureIris() {
  const video  = document.getElementById('irisCamVideo');
  const canvas = document.getElementById('irisCamCanvas');
  canvas.width  = video.videoWidth  || 1280;
  canvas.height = video.videoHeight || 1280;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.88);

  _irisCaptures[_irisSide].push(dataUrl);
  _refreshStrip();
  _updateIrisPreview(_irisSide);

  // 플래시 효과
  const flash = document.getElementById('irisCamFlash');
  if (flash) {
    flash.style.opacity = '0.7';
    setTimeout(() => { flash.style.opacity = '0'; }, 80);
  }
}

function _refreshStrip() {
  const strip = document.getElementById('irisCamStrip');
  const empty = document.getElementById('irisCamStripEmpty');
  if (!strip) return;
  const caps = _irisCaptures[_irisSide];
  // 기존 썸네일 제거
  strip.querySelectorAll('.iris-thumb').forEach(el => el.remove());
  if (caps.length === 0) {
    if (empty) empty.style.display = 'block';
    return;
  }
  if (empty) empty.style.display = 'none';
  caps.forEach((url, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'iris-thumb';
    wrap.style.cssText = 'position:relative;flex-shrink:0;cursor:pointer';
    wrap.innerHTML = `
      <img src="${url}" style="width:52px;height:52px;object-fit:cover;border-radius:6px;border:2px solid ${i === caps.length-1 ? '#60A5FA' : 'rgba(255,255,255,.2)'}">
      <span style="position:absolute;top:-5px;right:-5px;width:18px;height:18px;background:#DC2626;border-radius:50%;font-size:10px;color:white;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;border:1px solid #0A1628"
        onclick="deleteIrisCapture(${i})">✕</span>
      <span style="position:absolute;bottom:2px;left:2px;font-size:9px;color:white;background:rgba(0,0,0,.5);padding:0 3px;border-radius:2px;font-weight:700">${i+1}</span>`;
    strip.appendChild(wrap);
  });
  // 스크롤 맨 오른쪽
  strip.scrollLeft = strip.scrollWidth;
}

function deleteIrisCapture(idx) {
  _irisCaptures[_irisSide].splice(idx, 1);
  _refreshStrip();
  _updateIrisPreview(_irisSide);
}

function _updateIrisPreview(side) {
  const caps  = _irisCaptures[side];
  const img   = document.getElementById('iris_' + side + '_img');
  const ph    = document.getElementById('iris_' + side + '_placeholder');
  const badge = document.getElementById('iris_' + side + '_badge');
  if (caps.length === 0) {
    if (img)   { img.src = ''; img.style.display = 'none'; }
    if (ph)    ph.style.display = 'block';
    if (badge) badge.style.display = 'none';
  } else {
    if (img)   { img.src = caps[caps.length - 1]; img.style.display = 'block'; }
    if (ph)    ph.style.display = 'none';
    if (badge) { badge.textContent = caps.length + '장'; badge.style.display = 'block'; }
  }
}

function closeIrisCamera() {
  document.removeEventListener('keydown', _irisSpaceHandler);
  if (_irisStream) { _irisStream.getTracks().forEach(t => t.stop()); _irisStream = null; }
  const box = document.getElementById('irisCamBox');
  if (box) box.style.display = 'none';
}

// ── 환자 저장 / 수정 ────────────────────────────────────────────────
async function saveNewPatient() {
  const name  = (document.getElementById('af_name')?.value || '').trim();
  const phone = (document.getElementById('af_phone')?.value || '').trim();
  if (!name)  { alert('이름을 입력해주세요.');       goAddStep(1); return; }
  if (!phone) { alert('핸드폰 번호를 입력해주세요.'); goAddStep(1); return; }

  const surveySnapshot = {
    symptoms:    Array.from(_symSelected),
    sleep:       document.getElementById('af_sleep')?.value    || '',
    stress:      document.getElementById('af_stress')?.value   || '',
    exercise:    document.getElementById('af_exercise')?.value || '',
    smoking:     document.getElementById('af_smoking')?.value  || 'none',
    alcohol:     document.getElementById('af_alcohol')?.value  || 'none',
    vasScore:    parseInt(document.getElementById('af_vas')?.value || '5'),
    medications: collectMeds(),
    surgeries:   collectSurg(),
    pastHistory: Array.from(_pmhSelected),
    memo:        document.getElementById('af_memo')?.value || '',
    surveyPhoto: _addData.surveyPhoto || null,
  };
  const irisSnapshot = {
    left:  _irisCaptures.L.length ? _irisCaptures.L : null,
    right: _irisCaptures.R.length ? _irisCaptures.R : null,
  };

  const existing = _editPatientId ? _patients.find(r => r.id === _editPatientId) : null;
  const patientData = {
    id:         _editPatientId || undefined,
    name, phone,
    dob:        document.getElementById('af_dob')?.value    || '',
    gender:     document.getElementById('af_gender')?.value || '',
    address:    document.getElementById('af_addr')?.value   || '',
    occupation: document.getElementById('af_job')?.value    || '',
    email:      document.getElementById('af_email')?.value  || '',
    survey:     surveySnapshot,
    irisPhotos: {
      left:  irisSnapshot.left  ?? existing?.irisPhotos?.left  ?? null,
      right: irisSnapshot.right ?? existing?.irisPhotos?.right ?? null,
    },
  };

  const result = await apiPost('save_patient', { patient: patientData });
  if (!result.success) { alert('저장 실패: ' + (result.error || '')); return; }

  const savedId = result.id;
  await reloadData();
  closeAddPatient();
  if (_editPatientId) {
    navigate('patient', savedId);
    setTimeout(() => alert(`✓ 수정 완료!\n이름: ${name}`), 150);
  } else {
    const saved = _patients.find(p => p.id === savedId);
    navigate('patients');
    setTimeout(() => alert(`✓ 환자 등록 완료!\n환자 코드: ${saved?.unique_id || ''}\n이름: ${name}`), 200);
  }
}

function printReport(pid, vid) {
  const url = `index.html?record=${pid}&visit=${vid}&print=1`;
  const w = window.open(url, '_blank');
  if (!w) { alert('팝업 차단 해제 후 다시 시도해주세요.'); return; }
  w.addEventListener('load', () => setTimeout(() => w.print(), 800));
}

  renderContent();
}

// ── 최종관리자: 진단 시작 (홍채사진 포함) ──────────────────────────────────
async function startDiagFromIntake(id) {
  const item = _intake.find(i => i.id === id);
  if (!item) return;
  // 홍채사진이 있으면 별도 fetch
  if (item.hasPhotos && !_LOCAL_MODE) {
    try {
      const r = await apiPost('get_intake_photos', {id});
      if (r.photos) item.adminPhotos = r.photos;
    } catch(e) {}
  }
  await setIntakeStatus(id, 'diagnosing');
  sessionStorage.setItem('ludia_from_intake', JSON.stringify(item));
  location.href = 'index.html?from_intake=1';
}

function openIntakeReport(patientId, visitId) {
  const params = new URLSearchParams({record: patientId, report_only: '1'});
  if (visitId) params.set('visit', visitId);
  location.href = 'index.html?' + params.toString();
}

// ── 일반관리자: 메모·사진 토글 ──────────────────────────────────────────────
const _intakePhotos = {};  // { [id]: { left: dataUrl, right: dataUrl } }

function toggleIntakeDetail(id) {
  const el = document.getElementById('intake_detail_' + id);
  if (!el) return;
  const opening = el.style.display === 'none';
  el.style.display = opening ? 'block' : 'none';
  const btn = document.getElementById('toggle_detail_btn_' + id);
  if (btn) btn.textContent = opening ? '▲ 접기' : '📝 메모 · 사진 ▼';
  if (opening) {
    const item = _intake.find(i => i.id === id);
    const memoEl = document.getElementById('memo_' + id);
    if (memoEl && !memoEl.value && item?.adminMemo) memoEl.value = item.adminMemo;
    ['left','right'].forEach(eye => {
      const src = (_intakePhotos[id]||{})[eye] || item?.adminPhotos?.[eye];
      if (src) _setPhotoPreview(id, eye, src);
    });
  }
}

function _setPhotoPreview(id, eye, src) {
  const img = document.getElementById(`intake_photo_img_${eye}_${id}`);
  const ico = document.getElementById(`intake_photo_ico_${eye}_${id}`);
  if (img) { img.src = src; img.style.display = 'block'; }
  if (ico) ico.style.display = 'none';
}

function handleIrisPhoto(id, eye, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    if (!_intakePhotos[id]) _intakePhotos[id] = {};
    _intakePhotos[id][eye] = e.target.result;
    _setPhotoPreview(id, eye, e.target.result);
  };
  reader.readAsDataURL(file);
}

async function saveIntakeMemo(id) {
  const memoEl = document.getElementById('memo_' + id);
  if (!memoEl) return;
  const memo = memoEl.value;
  const item = _intake.find(i => i.id === id);
  if (item) item.adminMemo = memo;
  if (!_LOCAL_MODE) await apiPost('save_intake_memo', {id, memo});
}

async function forwardPatient(id) {
  const item = _intake.find(i => i.id === id);
  if (!item) return;
  const memoEl = document.getElementById('memo_' + id);
  const memo = memoEl?.value || item.adminMemo || '';
  const photos = _intakePhotos[id] || {};
  const name = item.name || '이 환자';
  if (!confirm(`${name} 님의 정보와 홍채사진을 최종관리자에게 전달하시겠습니까?`)) return;

  if (!_LOCAL_MODE) {
    const r = await apiPost('forward_patient', {id, memo, leftPhoto: photos.left||'', rightPhoto: photos.right||''});
    if (!r.success) { alert('전달 실패: ' + (r.error||'오류')); return; }
  }
  item.status = 'forwarded';
  item.adminMemo = memo;
  if (photos.left || photos.right) item.hasPhotos = true;
  updateIntakeBadge();
  renderContent();
  alert(`✅ ${name} 님의 정보가 최종관리자에게 전달되었습니다.\n진단이 완료되면 리포트를 받으실 수 있습니다.`);
}

    ? `<div style="font-size:12px;color:var(--text-light);padding:10px 0">발급된 초대 코드가 없습니다.</div>`
    : myCodes.map(c => `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-light)">
        <div>
          <span style="font-family:monospace;font-size:13px;font-weight:700;color:${c.used?'var(--text-light)':'var(--navy-dark)'}">${c.code}</span>
          ${c.used ? `<span style="font-size:10px;color:var(--text-light);margin-left:8px">사용됨 (${(c.used_at||c.usedAt||'').slice(0,10)})</span>` : '<span style="font-size:10px;color:var(--success);margin-left:8px;font-weight:700">사용 가능</span>'}
        </div>
        ${!c.used ? `<button onclick="deleteInviteCode('${c.code}')" style="font-size:11px;padding:3px 9px;border:1px solid #FCA5A5;border-radius:5px;background:none;color:var(--danger);cursor:pointer">삭제</button>` : ''}
      </div>`).join('');

  // Admin list (super admin only)
  const adminListHtml = IS_SUPER ? (() => {
    const users = _adminUsers.filter(u => u.role === 'admin');
    if (!users.length) return '<div style="font-size:12px;color:var(--text-light);padding:8px 0">등록된 관리자 없음</div>';
    return users.map(u => `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-light)">
        <div style="width:30px;height:30px;border-radius:50%;background:${u.isSuperAdmin?'#7C3AED':'var(--blue-primary)'};display:flex;align-items:center;justify-content:center;color:white;font-size:13px;font-weight:700;flex-shrink:0">${(u.name||'?')[0]}</div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700;color:var(--navy-dark)">${u.name} ${u.isSuperAdmin?'<span style="font-size:10px;color:#7C3AED;background:#F5F3FF;padding:1px 6px;border-radius:3px;font-weight:700">슈퍼</span>':''}</div>
          <div style="font-size:11px;color:var(--text-light)">${u.email} · <code style="font-size:11px">${u.admin_code||u.adminCode||'–'}</code></div>
        </div>
        <div style="font-size:11px;color:var(--text-light)">${getRecordsFor(u.id).length}명 담당</div>
      </div>`).join('');
  })() : '';

  return `
    <div class="pg-title">설정</div>
    <div class="pg-desc">시스템 설정을 관리합니다.</div>

    ${IS_SUPER ? `
    <div class="settings-card" style="margin-bottom:16px">
      <div style="font-size:14px;font-weight:700;color:var(--navy-dark);margin-bottom:12px">👥 관리자 목록</div>
      ${adminListHtml}
    </div>` : ''}

    <div class="settings-card" style="margin-bottom:16px">
      <div style="font-size:14px;font-weight:700;color:var(--navy-dark);margin-bottom:6px">🎟️ 회원 초대 코드</div>
      <div style="font-size:12px;color:var(--text-light);margin-bottom:14px;line-height:1.6">
        회원이 가입할 때 사용하는 1회용 초대 코드입니다.<br>코드와 어르신 고유번호를 함께 안내해주세요.
      </div>
      <button class="btn-prim" onclick="generateInviteCode()" style="margin-bottom:14px">+ 초대 코드 발급</button>
      <div id="inviteCodeList">${codesHtml}</div>
    </div>

    <div class="settings-card" style="margin-bottom:16px">
      <div style="font-size:14px;font-weight:700;color:var(--navy-dark);margin-bottom:10px">📋 어르신 고유번호 목록</div>
      <div style="font-size:12px;color:var(--text-light);margin-bottom:12px">각 어르신의 고유번호를 가족/보호자에게 알려주세요.</div>
      <div style="max-height:220px;overflow-y:auto">
        ${records.length === 0
          ? '<div style="font-size:12px;color:var(--text-light);padding:8px 0">등록된 환자 없음</div>'
          : records.map(p => `
            <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-light)">
              <span style="font-family:monospace;font-size:12px;font-weight:700;color:var(--blue-primary);background:var(--blue-bg);padding:3px 9px;border-radius:5px;flex-shrink:0">${p.uniqueId||'–'}</span>
              <span style="font-size:13px;font-weight:600">${p.name||'–'}</span>
              <span style="font-size:11px;color:var(--text-light)">${p.dob||''} · ${p.visits?.length||0}회 방문</span>
            </div>`).join('')}
      </div>
    </div>

    <div class="settings-card" style="margin-bottom:16px">
      <div style="font-size:14px;font-weight:700;color:var(--navy-dark);margin-bottom:10px">📦 저장소 현황</div>
      <div style="font-size:13px;color:var(--text-mid);margin-bottom:6px">${storageUsed}</div>
      <div style="font-size:12px;color:var(--text-light)">사진 포함: ${allVisits.filter(v=>v.leftEyePhoto||v.rightEyePhoto).length}건</div>
    </div>
    <div class="settings-card" style="margin-bottom:16px;border:1.5px solid #6EE7B7">
      <div style="font-size:14px;font-weight:700;color:#065F46;margin-bottom:8px">🔄 기존 데이터 이전 (LocalStorage → 서버 DB)</div>
      <div style="font-size:12px;color:var(--text-mid);margin-bottom:14px;line-height:1.7">
        이 기기에 저장된 기존 환자 데이터 / 관리자 계정 / 상담 신청을 서버 DB로 이전합니다.<br>
        이미 서버에 있는 데이터는 건너뜁니다. 이전 후에도 로컬 데이터는 삭제되지 않습니다.
      </div>
      <button onclick="migrateLocalData()" style="padding:9px 22px;background:linear-gradient(135deg,#059669,#065F46);color:white;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">데이터 이전 시작</button>
      <div id="migrateResult" style="margin-top:10px;font-size:12px;color:var(--text-mid)"></div>
    </div>
    ${IS_SUPER ? `
    <div class="settings-card" style="border:1px solid #FCA5A5">
      <div style="font-size:14px;font-weight:700;color:var(--danger);margin-bottom:8px">⚠️ 위험 구역</div>
      <div style="font-size:12px;color:var(--text-mid);margin-bottom:14px;line-height:1.7">모든 환자 데이터를 삭제합니다. 이 작업은 되돌릴 수 없습니다.</div>
      <button class="btn-danger" onclick="clearAllData()">전체 데이터 삭제</button>
    </div>` : ''}`;
}

function getRecordsFor(userId) {
  return _patients.filter(p => p.admin_id === userId || p.createdBy === userId);
}

async function generateInviteCode() {
  const result = await apiPost('create_invite_code');
  if (result.success) { await reloadData(); navigate('settings'); }
}

async function deleteInviteCode(code) {
  await apiPost('delete_invite_code', {code});
  await reloadData(); navigate('settings');
}

function changePassword() {} // legacy – no longer used

async function migrateLocalData() {
  const el = document.getElementById('migrateResult');
  if (el) el.textContent = '이전 중...';
  try {
    const users   = JSON.parse(localStorage.getItem('ludia_users')       || '[]');
    const records = JSON.parse(localStorage.getItem('ludia_records')     || '[]');
    const intake  = JSON.parse(localStorage.getItem('ludia_intake')      || '[]');
    const result  = await apiPost('migrate', {users, records, intake});
    const m = result.migrated || {};
    if (el) el.textContent = `완료! 관리자 ${m.users||0}명 · 환자 ${m.patients||0}명 · 방문 ${m.visits||0}건 · 상담 ${m.intake||0}건 이전됨.`;
    await reloadData();
  } catch(e) {
    if (el) el.textContent = '이전 실패: ' + e.message;
  }
}

function clearAllData() {
  alert('서버 DB 전환 후 이 기능은 비활성화되었습니다.\n개별 환자 삭제는 환자 상세 페이지에서 가능합니다.');
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
// 일반 관리자는 바로 환자 관리로, 최종관리자는 대시보드로
navigate(IS_SUPER ? 'dashboard' : 'patients');
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }
</script>
</body>
</html>
