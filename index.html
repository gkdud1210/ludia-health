<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUDIA HEALTH — 홍채 건강 진단 시스템</title>
<style>
:root {
  --navy-dark: #0A1628;
  --navy-mid: #1E3A5F;
  --navy-light: #2E5C8A;
  --blue-primary: #2E6DB4;
  --blue-light: #5B9BD5;
  --blue-pale: #B8D4F0;
  --blue-bg: #EBF4FF;
  --white: #FFFFFF;
  --off-white: #F0F4F8;
  --gray-light: #E2EAF2;
  --text-dark: #0A1628;
  --text-mid: #374151;
  --text-light: #6B7280;
  --success: #10B981;
  --warning: #F59E0B;
  --orange: #F97316;
  --danger: #EF4444;
  --border: #D1DCE8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--off-white);color:var(--text-dark);min-height:100vh;}

/* ── HEADER ── */
.header{background:var(--navy-dark);height:66px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.35);}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;}
.logo-eye{width:38px;height:38px;background:linear-gradient(135deg,var(--blue-primary),var(--navy-light));border-radius:10px;display:flex;align-items:center;justify-content:center;}
.logo-eye svg{width:22px;height:22px;fill:none;stroke:white;stroke-width:1.8;}
.logo-info{}
.logo-name{font-size:18px;font-weight:800;color:white;letter-spacing:3px;}
.logo-tagline{font-size:10px;color:var(--blue-pale);letter-spacing:1.5px;margin-top:-1px;}
.header-badge{padding:5px 12px;border:1px solid rgba(255,255,255,.2);border-radius:20px;font-size:11px;color:rgba(255,255,255,.7);letter-spacing:.5px;}
.lang-switch{display:flex;gap:0;border:1px solid rgba(255,255,255,.25);border-radius:8px;overflow:hidden;}
.lang-btn{padding:5px 12px;background:none;border:none;color:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.5px;transition:all .18s;}
.lang-btn:hover{color:rgba(255,255,255,.85);}
.lang-btn.active{background:var(--blue-primary);color:white;}
.lang-sep{width:1px;background:rgba(255,255,255,.2);}

/* ── PROGRESS ── */
#progressBar{background:var(--navy-mid);padding:14px 28px;display:none;}
.progress-inner{max-width:780px;margin:0 auto;}
.progress-steps{display:flex;align-items:center;gap:0;}
.step-item{display:flex;align-items:center;flex:1;}
.step-item:last-child{flex:none;}
.step-dot{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:rgba(255,255,255,.4);transition:all .35s;flex-shrink:0;}
.step-dot.active{background:var(--blue-primary);border-color:var(--blue-primary);color:white;box-shadow:0 0 14px rgba(46,109,180,.7);}
.step-dot.done{background:var(--success);border-color:var(--success);color:white;}
.step-line{flex:1;height:2px;background:rgba(255,255,255,.15);transition:background .35s;margin:0 4px;}
.step-line.done{background:var(--success);}
.progress-label{display:flex;justify-content:space-between;margin-top:8px;padding:0 2px;}
.progress-label span{font-size:10px;color:rgba(255,255,255,.45);text-align:center;width:30px;}
.progress-label span.active{color:var(--blue-pale);}

/* ── MAIN ── */
.main{max-width:780px;margin:32px auto;padding:0 16px 80px;}
.card{background:white;border-radius:18px;padding:40px 44px;box-shadow:0 4px 28px rgba(10,22,40,.09);border:1px solid var(--border);}
@media(max-width:600px){.card{padding:24px 20px;}.main{margin:16px auto;}}

/* ── STEP HEADER ── */
.step-header{margin-bottom:28px;}
.step-badge{display:inline-flex;align-items:center;gap:6px;background:var(--blue-bg);border:1px solid var(--blue-pale);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;color:var(--blue-primary);letter-spacing:.5px;margin-bottom:10px;}
.step-title{font-size:22px;font-weight:800;color:var(--navy-dark);margin-bottom:5px;}
.step-desc{font-size:14px;color:var(--text-light);line-height:1.6;}

/* ── FORM ── */
.form-group{margin-bottom:20px;}
.form-label{display:block;font-size:13px;font-weight:700;color:var(--navy-mid);margin-bottom:7px;letter-spacing:.2px;}
.req{color:var(--danger);}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;color:var(--text-dark);background:white;transition:border-color .2s,box-shadow .2s;outline:none;font-family:inherit;}
.form-input:focus{border-color:var(--blue-primary);box-shadow:0 0 0 3px rgba(46,109,180,.1);}
select.form-input{cursor:pointer;}
textarea.form-input{min-height:80px;resize:vertical;line-height:1.6;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:520px){.form-row{grid-template-columns:1fr;}}
.hint{font-size:11px;color:var(--text-light);margin-top:5px;}

/* ── CHECKBOXES ── */
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px;}
.check-item{display:flex;align-items:center;gap:9px;padding:10px 13px;border:1.5px solid var(--border);border-radius:9px;cursor:pointer;transition:all .18s;background:var(--off-white);user-select:none;}
.check-item:hover{border-color:var(--blue-light);background:var(--blue-bg);}
.check-item.checked{border-color:var(--blue-primary);background:var(--blue-bg);}
.check-item input{width:15px;height:15px;accent-color:var(--blue-primary);cursor:pointer;flex-shrink:0;}
.check-text{font-size:13px;color:var(--text-dark);}

/* ── RADIO ── */
.radio-row{display:flex;gap:10px;flex-wrap:wrap;}
.radio-item{display:flex;align-items:center;gap:8px;padding:9px 18px;border:1.5px solid var(--border);border-radius:9px;cursor:pointer;transition:all .18s;user-select:none;}
.radio-item:hover{border-color:var(--blue-light);}
.radio-item.sel{border-color:var(--blue-primary);background:var(--blue-bg);}
.radio-item input{accent-color:var(--blue-primary);cursor:pointer;}
.radio-text{font-size:13px;font-weight:500;}

/* ── PAIN SLIDER ── */
.pain-val{text-align:center;font-size:36px;font-weight:800;color:var(--blue-primary);margin:4px 0;}
.pain-slider{width:100%;-webkit-appearance:none;height:8px;border-radius:4px;background:linear-gradient(to right,var(--success),var(--warning),var(--danger));outline:none;cursor:pointer;}
.pain-slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--blue-primary);border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;}
.pain-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text-light);margin-top:5px;}

/* ── DYNAMIC LIST ── */
.dyn-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.dyn-item{display:flex;gap:8px;align-items:stretch;}
.dyn-item .form-input{flex:1;}
.btn-rm{width:34px;min-width:34px;border:1.5px solid #FCA5A5;border-radius:8px;background:none;color:var(--danger);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .18s;}
.btn-rm:hover{background:#FEE2E2;}
.btn-add{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px dashed var(--blue-light);border-radius:9px;background:none;color:var(--blue-primary);font-size:13px;cursor:pointer;transition:all .18s;font-family:inherit;}
.btn-add:hover{background:var(--blue-bg);}

/* ── YES/NO TOGGLE ── */
.toggle-row{display:flex;gap:10px;}
.toggle-btn{flex:1;padding:11px;border:1.5px solid var(--border);border-radius:9px;background:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;font-family:inherit;}
.toggle-btn.active-yes{border-color:var(--blue-primary);background:var(--blue-bg);color:var(--blue-primary);}
.toggle-btn.active-no{border-color:var(--border);background:var(--gray-light);color:var(--text-mid);}

/* ── LIFESTYLE GRID ── */
.ls-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:520px){.ls-grid{grid-template-columns:1fr;}}
.ls-card{background:var(--off-white);border:1px solid var(--border);border-radius:10px;padding:14px;}
.ls-label{font-size:12px;font-weight:700;color:var(--navy-mid);margin-bottom:8px;display:flex;align-items:center;gap:5px;}

/* ── IRIS UPLOAD ── */
.iris-panel{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:560px){.iris-panel{grid-template-columns:1fr;}}
.iris-upload{border:2px dashed var(--blue-light);border-radius:14px;padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;background:#F5FAFF;position:relative;overflow:hidden;}
.iris-upload:hover{border-color:var(--blue-primary);background:var(--blue-bg);}
.iris-upload.has-img{border-style:solid;border-color:var(--blue-primary);}
.iris-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.iris-thumb{width:140px;height:140px;border-radius:50%;object-fit:cover;margin:0 auto 12px;display:block;box-shadow:0 4px 16px rgba(0,0,0,.15);}
.upload-icon{font-size:44px;margin-bottom:10px;}
.upload-title{font-size:14px;font-weight:700;color:var(--navy-mid);margin-bottom:4px;}
.upload-sub{font-size:12px;color:var(--text-light);}
.eye-side-btn{width:100%;margin-top:10px;padding:9px;border:1.5px solid var(--border);border-radius:9px;background:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s;}
.eye-side-btn.active{border-color:var(--blue-primary);background:var(--blue-bg);color:var(--blue-primary);}
.iris-guide{background:var(--blue-bg);border:1px solid var(--blue-pale);border-radius:10px;padding:16px;}
.iris-guide h4{font-size:13px;font-weight:700;color:var(--navy-mid);margin-bottom:10px;}
.iris-guide li{font-size:12px;color:var(--text-mid);line-height:1.8;margin-left:14px;}

/* ── ZONE ASSESSMENT ── */
.zone-assess-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:4px;}
@media(max-width:560px){.zone-assess-grid{grid-template-columns:1fr;}}
.zone-assess-card{background:var(--off-white);border:1.5px solid var(--border);border-radius:12px;padding:15px;transition:border-color .2s;}
.zone-assess-card:hover{border-color:var(--blue-light);}
.za-header{display:flex;align-items:center;gap:7px;margin-bottom:10px;}
.za-icon{font-size:18px;line-height:1;}
.za-name{font-size:13px;font-weight:700;color:var(--navy-mid);}
.status-btns{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px;}
.status-btn{padding:5px 8px;border:1.5px solid var(--border);border-radius:7px;background:none;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .16s;color:var(--text-mid);}
.status-btn:hover{border-color:var(--blue-light);color:var(--navy-mid);}
.za-note{font-size:12px;min-height:unset;padding:8px 10px;}
.rpt-zone-status{font-size:13px;font-weight:700;margin-bottom:2px;}
.rpt-zone-note{font-size:11px;color:var(--text-light);font-style:italic;margin-top:3px;line-height:1.5;}
.pupil-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;}
.pupil-card{background:var(--off-white);border:1px solid var(--border);border-radius:8px;padding:10px 16px;min-width:120px;}
.overall-note-box{margin-top:14px;background:#F0F7FF;border:1px solid var(--blue-pale);border-radius:9px;padding:14px;}
.overall-note-label{font-size:12px;font-weight:700;color:var(--navy-mid);margin-bottom:5px;}
.overall-note-text{font-size:13px;color:var(--text-mid);line-height:1.7;}

/* ── ANALYZING OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(10,22,40,.88);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;}
.overlay.on{display:flex;}
.spinner{width:72px;height:72px;border:4px solid rgba(255,255,255,.1);border-top-color:var(--blue-primary);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:24px;}
@keyframes spin{to{transform:rotate(360deg);}}
.ov-title{color:white;font-size:20px;font-weight:700;margin-bottom:8px;}
.ov-sub{color:rgba(255,255,255,.55);font-size:13px;}
.ov-bar{width:260px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:20px;overflow:hidden;}
.ov-bar-fill{height:100%;width:0;background:var(--blue-primary);border-radius:2px;transition:width .4s ease;}

/* ── REPORT ── */
.rpt-hero{background:linear-gradient(135deg,var(--navy-dark) 0%,var(--navy-mid) 100%);border-radius:14px;padding:26px 30px;color:white;margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-start;}
.rpt-name{font-size:18px;font-weight:800;letter-spacing:.5px;margin-bottom:3px;}
.rpt-meta{font-size:12px;opacity:.65;line-height:1.8;}
.rpt-score-ring{width:82px;height:82px;border-radius:50%;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.rpt-score-num{font-size:26px;font-weight:800;}
.rpt-score-lbl{font-size:10px;opacity:.65;margin-top:-2px;}
.sec-title{font-size:15px;font-weight:800;color:var(--navy-mid);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--blue-pale);display:flex;align-items:center;gap:8px;}
.sec-title span{font-size:18px;}
.rpt-section{margin-bottom:26px;}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
@media(max-width:500px){.info-grid{grid-template-columns:1fr 1fr;}}
.info-card{background:var(--off-white);border:1px solid var(--border);border-radius:9px;padding:12px 14px;}
.info-lbl{font-size:11px;color:var(--text-light);margin-bottom:3px;}
.info-val{font-size:14px;font-weight:700;color:var(--navy-dark);}
.iris-rpt-grid{display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:start;}
@media(max-width:560px){.iris-rpt-grid{grid-template-columns:1fr;}}
.iris-canvas-box{text-align:center;}
.iris-canvas-box canvas{border-radius:50%;box-shadow:0 6px 24px rgba(0,0,0,.18);}
.iris-legend{font-size:11px;color:var(--text-light);margin-top:8px;line-height:1.8;}
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.zone-card{padding:11px 13px;border-radius:9px;border-left:3px solid;}
.zone-card.g{background:#F0FDF4;border-left-color:var(--success);}
.zone-card.w{background:#FFFBEB;border-left-color:var(--warning);}
.zone-card.o{background:#FFF7ED;border-left-color:var(--orange);}
.zone-card.r{background:#FEF2F2;border-left-color:var(--danger);}
.zone-name{font-size:11px;font-weight:700;color:var(--navy-mid);margin-bottom:3px;}
.zone-score{font-size:20px;font-weight:800;}
.zone-card.g .zone-score{color:var(--success);}
.zone-card.w .zone-score{color:var(--warning);}
.zone-card.o .zone-score{color:var(--orange);}
.zone-card.r .zone-score{color:var(--danger);}
.zone-note{font-size:11px;color:var(--text-light);margin-top:2px;}
.tag-list{display:flex;flex-wrap:wrap;gap:7px;}
.tag{padding:4px 10px;background:var(--blue-bg);border:1px solid var(--blue-pale);border-radius:20px;font-size:12px;color:var(--blue-primary);font-weight:600;}
.tag.none{background:var(--gray-light);border-color:var(--border);color:var(--text-light);}
.rec-list{display:flex;flex-direction:column;gap:10px;}
.rec-item{display:flex;gap:12px;padding:13px 15px;background:var(--off-white);border:1px solid var(--border);border-radius:10px;}
.rec-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.rec-icon.blue{background:var(--blue-bg);}
.rec-icon.green{background:#F0FDF4;}
.rec-icon.yellow{background:#FFFBEB;}
.rec-icon.red{background:#FEF2F2;}
.rec-body strong{font-size:13px;font-weight:700;color:var(--navy-dark);display:block;margin-bottom:2px;}
.rec-body p{font-size:12px;color:var(--text-mid);line-height:1.6;}
.disclaimer{font-size:11px;color:var(--text-light);background:var(--gray-light);border-radius:9px;padding:13px 16px;line-height:1.7;margin-top:16px;border:1px solid var(--border);}

/* ── WELCOME ── */
.welcome{text-align:center;padding:50px 36px;}
.wlc-icon{width:84px;height:84px;background:linear-gradient(135deg,var(--blue-primary),var(--navy-mid));border-radius:22px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(46,109,180,.35);}
.wlc-icon svg{width:44px;height:44px;fill:none;stroke:white;stroke-width:1.6;}
.wlc-title{font-size:28px;font-weight:800;color:var(--navy-dark);margin-bottom:8px;}
.wlc-desc{font-size:15px;color:var(--text-mid);max-width:460px;margin:0 auto 32px;line-height:1.75;}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:34px;text-align:left;}
@media(max-width:560px){.feat-grid{grid-template-columns:1fr;}}
.feat-card{background:var(--off-white);border:1px solid var(--border);border-radius:12px;padding:16px;}
.feat-icon{font-size:26px;margin-bottom:8px;}
.feat-title{font-size:13px;font-weight:700;color:var(--navy-mid);margin-bottom:4px;}
.feat-desc{font-size:12px;color:var(--text-light);line-height:1.55;}

/* ── NAV BUTTONS ── */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:32px;padding-top:22px;border-top:1px solid var(--border);}
.btn-back{padding:11px 24px;border:1.5px solid var(--border);border-radius:10px;background:none;color:var(--text-mid);font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;font-family:inherit;}
.btn-back:hover{border-color:var(--navy-mid);color:var(--navy-dark);}
.btn-next{padding:11px 30px;border:none;border-radius:10px;background:var(--blue-primary);color:white;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(46,109,180,.32);font-family:inherit;letter-spacing:.3px;}
.btn-next:hover{background:var(--navy-light);transform:translateY(-1px);box-shadow:0 6px 18px rgba(46,109,180,.4);}
.btn-start{padding:15px 50px;border:none;border-radius:13px;background:linear-gradient(135deg,var(--blue-primary),var(--navy-mid));color:white;font-size:16px;font-weight:800;cursor:pointer;transition:all .22s;box-shadow:0 6px 22px rgba(46,109,180,.38);letter-spacing:.5px;font-family:inherit;}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(46,109,180,.48);}
.btn-outline{padding:11px 24px;border:1.5px solid var(--blue-primary);border-radius:10px;background:none;color:var(--blue-primary);font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;font-family:inherit;}
.btn-outline:hover{background:var(--blue-bg);}
.btn-dark{padding:11px 24px;border:none;border-radius:10px;background:var(--navy-dark);color:white;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:7px;font-family:inherit;}
.btn-dark:hover{background:var(--navy-mid);}
.divider{height:1px;background:var(--border);margin:22px 0;}

/* ── IRIS DRAWING CANVAS ── */
.iris-draw-layout{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;}
@media(max-width:660px){.iris-draw-layout{grid-template-columns:1fr;}.iris-canvas-outer{align-items:stretch;}.iris-draw-canvas-wrap{width:100%!important;height:auto!important;aspect-ratio:1;}}
.iris-canvas-outer{display:flex;flex-direction:column;gap:8px;}
.iris-draw-canvas-wrap{position:relative;width:300px;height:300px;border-radius:50%;overflow:hidden;box-shadow:0 4px 28px rgba(0,0,0,.22);flex-shrink:0;}
#irisTemplateCanvas,#irisDrawCanvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;}
#irisTemplateCanvas{pointer-events:none;}
#irisDrawCanvas{cursor:crosshair;touch-action:none;}
.draw-toolbar{background:var(--off-white);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;}
.dtool-label{font-size:10px;font-weight:700;color:var(--text-light);letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase;}
.color-palette{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.color-swatch{width:32px;height:32px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:transform .15s,box-shadow .15s;}
.color-swatch:hover{transform:scale(1.1);}
.color-swatch.active{box-shadow:0 0 0 2px white,0 0 0 4px var(--navy-dark);}
.size-row{display:flex;gap:6px;margin-bottom:14px;}

function init() { buildProgress(); renderStep(); }

function buildProgress() {
  const steps = document.getElementById('progressSteps');
  const labels = document.getElementById('progressLabels');
  let sh='', lh='';
  for (let i=1;i<=TOTAL_STEPS;i++) {
    sh+=`<div class="step-dot" id="sd${i}">${i}</div>`;
    if(i<TOTAL_STEPS) sh+=`<div class="step-line" id="sl${i}"></div>`;
    lh+=`<span id="sl_lbl${i}"></span>`;
  }
  steps.innerHTML=sh; labels.innerHTML=lh;
}

function updateProgress() {
  const pb=document.getElementById('progressBar');
  if(step===0||step===9){pb.style.display='none';return;}
  pb.style.display='block';
  const lbls=STEP_LABELS[lang];
  for(let i=1;i<=TOTAL_STEPS;i++){
    const dot=document.getElementById(`sd${i}`);
    dot.className='step-dot'+(i<step?' done':i===step?' active':'');
    dot.textContent=i<step?'✓':i;
    if(i<TOTAL_STEPS) document.getElementById(`sl${i}`).className='step-line'+(i<step?' done':'');
    const lbl=document.getElementById(`sl_lbl${i}`);
    if(lbl){lbl.textContent=lbls[i-1];lbl.className=i===step?'active':'';}
  }
}

function renderStep() {
  updateProgress();
  [r0,r1,r2,r3,r4,r5,r6,r7,r8,r9][step]();
  window.scrollTo({top:0,behavior:'smooth'});
}

function next(){step++;renderStep();}

// ═══════════════════════════════════════════
//  IRIS TEMPLATE & DRAWING ENGINE
// ═══════════════════════════════════════════
function drawIrisTemplate(ctx,cx,cy,R){
  const W=cx*2; ctx.clearRect(0,0,W,W);
  const sg=ctx.createRadialGradient(cx,cy-R*.12,R*.15,cx,cy,R);
  sg.addColorStop(0,'#FFFFFF'); sg.addColorStop(1,'#EDF2F7');
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=sg; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,R*.88,0,Math.PI*2); ctx.fillStyle='#C8DCF0'; ctx.fill();
  const zNames=lang==='ko'?['호흡기','심혈관','면역','소화기','비뇨기','근골격','내분비','신경']:['Resp.','Cardio.','Immune','Digest.','Urinary','Musculo.','Endo.','Nervous'];
  const n=8,aStep=Math.PI*2/n;
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*aStep;
    ctx.beginPath(); ctx.moveTo(cx+R*.38*Math.cos(a),cy+R*.38*Math.sin(a)); ctx.lineTo(cx+R*.9*Math.cos(a),cy+R*.9*Math.sin(a));
    ctx.strokeStyle='rgba(20,45,90,.28)'; ctx.lineWidth=1; ctx.stroke();
    const ma=a+aStep/2;
    ctx.fillStyle='rgba(12,30,60,.6)'; ctx.font=`bold ${Math.round(R*.073)}px -apple-system,sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(zNames[i],cx+R*.63*Math.cos(ma),cy+R*.63*Math.sin(ma));
  }
  [.52,.68,.81].forEach(r=>{
    ctx.beginPath(); ctx.arc(cx,cy,R*r,0,Math.PI*2);
    ctx.strokeStyle='rgba(20,58,100,.12)'; ctx.lineWidth=.8; ctx.setLineDash([3,5]); ctx.stroke(); ctx.setLineDash([]);
  });
  for(let a=0;a<Math.PI*2;a+=Math.PI/24){
    ctx.beginPath(); ctx.moveTo(cx+R*.39*Math.cos(a),cy+R*.39*Math.sin(a)); ctx.lineTo(cx+R*.88*Math.cos(a),cy+R*.88*Math.sin(a));
    ctx.strokeStyle='rgba(80,130,190,.08)'; ctx.lineWidth=.5; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx,cy,R*.41,0,Math.PI*2); ctx.strokeStyle='rgba(20,50,100,.5)'; ctx.lineWidth=2; ctx.stroke();
  const ig=ctx.createRadialGradient(cx,cy,R*.2,cx,cy,R*.41);
  ig.addColorStop(0,'#2A4A6F'); ig.addColorStop(1,'#1A3356');
  ctx.beginPath(); ctx.arc(cx,cy,R*.41,0,Math.PI*2); ctx.fillStyle=ig; ctx.fill();
  const pg=ctx.createRadialGradient(cx-R*.05,cy-R*.07,R*.02,cx,cy,R*.28);
  pg.addColorStop(0,'#1A1A2E'); pg.addColorStop(1,'#05050D');
  ctx.beginPath(); ctx.arc(cx,cy,R*.28,0,Math.PI*2); ctx.fillStyle=pg; ctx.fill();
  ctx.beginPath(); ctx.arc(cx-R*.1,cy-R*.1,R*.065,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,.52)'; ctx.fill();
  ctx.fillStyle='rgba(20,50,100,.4)'; ctx.font=`${Math.round(R*.068)}px -apple-system,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const cr=R*.94;
  [[0,'12'],[90,'3'],[180,'6'],[270,'9']].forEach(([d,l])=>{
    const rad=(d-90)*Math.PI/180; ctx.fillText(l,cx+cr*Math.cos(rad),cy+cr*Math.sin(rad));
  });
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.strokeStyle='#A0BAD0'; ctx.lineWidth=2; ctx.stroke();
}

function initIrisDrawing(){
  const tmpl=document.getElementById('irisTemplateCanvas');
  const draw=document.getElementById('irisDrawCanvas');
  if(!tmpl||!draw) return;
  drawIrisTemplate(tmpl.getContext('2d'),150,150,148);
  if(fd.irisDrawingLayer){
    const img=new Image();
    img.onload=()=>{draw.getContext('2d').clearRect(0,0,300,300);draw.getContext('2d').drawImage(img,0,0);DS.history=[draw.toDataURL()];};
    img.src=fd.irisDrawingLayer;
  } else { DS.history=['empty']; }
  draw.onmousedown=e=>{DS.active=true;const p=cvPos(draw,e);DS.lx=p.x;DS.ly=p.y;};
  draw.onmousemove=e=>{if(DS.active)cvDraw(draw.getContext('2d'),cvPos(draw,e));};
  draw.onmouseup=()=>{if(DS.active){DS.active=false;pushHistory(draw);}};
  draw.onmouseleave=()=>{if(DS.active){DS.active=false;pushHistory(draw);}};
  draw.ontouchstart=e=>{e.preventDefault();DS.active=true;const p=cvPos(draw,e.touches[0]);DS.lx=p.x;DS.ly=p.y;};
  draw.ontouchmove=e=>{e.preventDefault();if(DS.active)cvDraw(draw.getContext('2d'),cvPos(draw,e.touches[0]));};
  draw.ontouchend=()=>{DS.active=false;pushHistory(draw);};
}
function cvPos(canvas,evt){
  const r=canvas.getBoundingClientRect(),sx=canvas.width/r.width,sy=canvas.height/r.height;
  return{x:(evt.clientX-r.left)*sx,y:(evt.clientY-r.top)*sy};
}
function cvDraw(ctx,pos){
  ctx.beginPath(); ctx.moveTo(DS.lx,DS.ly); ctx.lineTo(pos.x,pos.y);
  if(DS.tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle='rgba(0,0,0,1)';ctx.lineWidth=DS.size*5;}
  else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=DS.color;ctx.lineWidth=DS.size;}
  ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  ctx.globalCompositeOperation='source-over';DS.lx=pos.x;DS.ly=pos.y;
}
function pushHistory(draw){const url=draw.toDataURL();if(DS.history.length>=20)DS.history.shift();DS.history.push(url);}
function undoDraw(){
  if(DS.history.length<=1)return;
  DS.history.pop();
  const draw=document.getElementById('irisDrawCanvas');if(!draw)return;
  const ctx=draw.getContext('2d'),prev=DS.history[DS.history.length-1];
  ctx.clearRect(0,0,300,300);
  if(prev!=='empty'){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=prev;}
}
function clearDrawing(){const draw=document.getElementById('irisDrawCanvas');if(!draw)return;draw.getContext('2d').clearRect(0,0,300,300);DS.history=['empty'];}
function setDrawColor(color,el){DS.color=color;DS.tool='pen';document.querySelectorAll('.color-swatch').forEach(d=>d.classList.remove('active'));el.classList.add('active');document.getElementById('toolPen')?.classList.add('t-active');document.getElementById('toolEraser')?.classList.remove('t-active','e-active');}
function setDrawSize(size,el){DS.size=size;document.querySelectorAll('.sz-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function setDrawTool(tool,el){DS.tool=tool;document.getElementById('toolPen')?.classList.toggle('t-active',tool==='pen');const er=document.getElementById('toolEraser');if(er){er.classList.toggle('t-active',false);er.classList.toggle('e-active',tool==='eraser');}}
function saveDrawLayer(){const draw=document.getElementById('irisDrawCanvas');if(draw)fd.irisDrawingLayer=draw.toDataURL();}
function goToReport(){
  const tmpl=document.getElementById('irisTemplateCanvas'),draw=document.getElementById('irisDrawCanvas');
  if(tmpl&&draw){
    const merge=document.createElement('canvas');merge.width=300;merge.height=300;
    const mctx=merge.getContext('2d');mctx.drawImage(tmpl,0,0);mctx.drawImage(draw,0,0);
    fd.irisDrawing=merge.toDataURL('image/png');fd.irisDrawingLayer=draw.toDataURL();

  fd.scores=scoreFromAssessment();step=9;renderStep();
}

      endocrine:   [t('내분비계 점검 권고','Endocrine System Check'),        t('갑상선 기능 및 혈당 검사를 정기적으로 받으세요. 내분비내과 전문의 상담을 권장합니다.','Get regular thyroid function and blood glucose tests. An endocrinologist consultation is recommended.')],
      urinary:     [t('비뇨기계 관리 권고','Urinary Care Recommended'),      t('하루 1.5~2L의 수분 섭취를 유지하세요. 비뇨기과 상담을 받아보세요.','Maintain 1.5–2L daily fluid intake. Consider a urology consultation.')],
      musculoskeletal:[t('근골격계 강화 필요','Musculoskeletal Strengthening'),t('규칙적인 스트레칭과 근력 운동을 권장합니다. 관절 통증이 지속될 경우 정형외과 상담을 받아보세요.','Regular stretching and strength training are recommended. Consult an orthopedic specialist if joint pain persists.')],
      respiratory: [t('호흡기 건강 주의','Respiratory Health Caution'),      t('금연을 강력히 권장하며 공기 질 관리에 신경 써주세요. 폐 기능 검사를 권장합니다.','Smoking cessation is strongly recommended. Manage air quality and consider a pulmonary function test.')],
    };
    low.slice(0,3).forEach(([k,v])=>{
      const a=adv[k];if(!a)return;
      recs.push({icon:'⚠️',cls:'yellow',title:a[0],body:`${nm[k]} ${t('점수','score')}: ${v} — ${a[1]}`});
    });
  }
  if(fd.smoking==='current') recs.push({icon:'🚭',cls:'red',title:t('금연 강력 권고','Smoking Cessation Strongly Advised'),body:t('흡연은 폐암, 심혈관질환 등 다양한 질환의 위험 요인입니다. 금연 클리닉 상담을 적극 권장합니다.','Smoking is a risk factor for lung cancer, cardiovascular disease, and more. A smoking cessation clinic is highly recommended.')});
  if(fd.stress==='very_high') recs.push({icon:'🧘',cls:'blue',title:t('스트레스 관리','Stress Management'),body:t('만성 스트레스는 면역·심혈관 건강에 악영향을 줍니다. 전문 심리 상담 및 이완 요법을 고려해 보세요.','Chronic stress negatively affects immune and cardiovascular health. Consider professional counseling and relaxation techniques.')});
  if(fd.exercise==='rarely') recs.push({icon:'🏃',cls:'blue',title:t('운동 습관 형성','Build Exercise Habits'),body:t('주 3회 이상 30분의 유산소 운동을 목표로 해보세요. 걷기, 수영 등 저강도 운동부터 시작하시길 권장합니다.','Aim for 30 minutes of aerobic exercise 3+ times/week. Start with low-intensity activities like walking or swimming.')});
  recs.push({icon:'📅',cls:'blue',title:t('정기 건강검진 권고','Regular Health Screening'),body:t('연 1~2회 종합 건강검진을 통해 건강 상태를 지속적으로 모니터링하세요.','Monitor your health with comprehensive check-ups 1–2 times per year.')});
  return recs.map(r=>`<div class="rec-item"><div class="rec-icon ${r.cls}">${r.icon}</div><div class="rec-body"><strong>${r.title}</strong><p>${r.body}</p></div></div>`).join('');
}

// ═══════════════════════════════════════════
//  IRIS CANVAS (computed fallback)
// ═══════════════════════════════════════════
function drawIrisCanvas(scores){
  const canvas=document.getElementById('irisCanvas');if(!canvas)return;
  const ctx=canvas.getContext('2d'),cx=100,cy=100,W=200;
  ctx.clearRect(0,0,W,W);
  const sc=ctx.createRadialGradient(cx,cy,80,cx,cy,98);
  sc.addColorStop(0,'#f5f5f5');sc.addColorStop(1,'#e0e0e0');
  ctx.beginPath();ctx.arc(cx,cy,99,0,Math.PI*2);ctx.fillStyle=sc;ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,99,0,Math.PI*2);ctx.strokeStyle='#ccc';ctx.lineWidth=1;ctx.stroke();
  const order=['respiratory','cardiovascular','immune','digestive','urinary','musculoskeletal','endocrine','nervous'];
  const nZ=order.length,start=-Math.PI/2;
  function zColor(v){return v>=80?'#10B981':v>=65?'#F59E0B':v>=50?'#F97316':'#EF4444';}
  for(let i=0;i<nZ;i++){
    const a1=start+i*(Math.PI*2/nZ),a2=start+(i+1)*(Math.PI*2/nZ),v=scores[order[i]];
    ctx.beginPath();ctx.moveTo(cx+60*Math.cos(a1),cy+60*Math.sin(a1));ctx.arc(cx,cy,88,a1,a2);ctx.arc(cx,cy,60,a2,a1,true);ctx.closePath();
    ctx.fillStyle=zColor(v)+'CC';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1;ctx.stroke();
  }
  for(let a=0;a<Math.PI*2;a+=Math.PI/20){ctx.beginPath();ctx.moveTo(cx+42*Math.cos(a),cy+42*Math.sin(a));ctx.lineTo(cx+88*Math.cos(a),cy+88*Math.sin(a));ctx.strokeStyle='rgba(0,0,0,.08)';ctx.lineWidth=.6;ctx.stroke();}
  const ig=ctx.createRadialGradient(cx,cy,30,cx,cy,60);ig.addColorStop(0,'#1E3A5F');ig.addColorStop(1,'#0F2040');
  ctx.beginPath();ctx.arc(cx,cy,60,0,Math.PI*2);ctx.fillStyle=ig;ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,42,0,Math.PI*2);ctx.strokeStyle='rgba(91,155,213,.5)';ctx.lineWidth=1.5;ctx.stroke();
  const pg=ctx.createRadialGradient(cx-4,cy-4,2,cx,cy,32);pg.addColorStop(0,'#1a1a2e');pg.addColorStop(1,'#050505');
  ctx.beginPath();ctx.arc(cx,cy,32,0,Math.PI*2);ctx.fillStyle=pg;ctx.fill();
  ctx.beginPath();ctx.arc(cx-10,cy-10,7,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill();
  ctx.beginPath();ctx.arc(cx+8,cy+7,3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.2)';ctx.fill();
}
